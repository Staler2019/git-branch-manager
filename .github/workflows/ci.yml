name: ci

on:
  pull_request:
    branches: [main]

# Without this the matrix queues for hours on a busy repository, and stale runs
# keep burning minutes after a force-push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang-format
        uses: jidicula/clang-format-action@v4.13.0
        with:
          clang-format-version: '18'
          check-path: 'src'

      # The core/capi split is the load-bearing structural decision: core must
      # stay free of any UI toolkit so the whole data layer is testable
      # headless. A grep is crude but it cannot be argued with, and it fails
      # fast. Historically this caught Qt specifically (src/app, since
      # removed in favour of the Flutter UI in app_flutter/); the rule itself
      # -- core never depends on whatever UI sits on top of it -- still holds.
      - name: core must not depend on Qt
        run: |
          if grep -rEn '#include\s*[<"]Q' src/core; then
            echo "::error::src/core must not include Qt headers - it is the headless, testable layer"
            exit 1
          fi
          echo "core is Qt-free"

  conventional-commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release version is derived from commit messages, so a malformed one is
      # not cosmetic: it silently produces the wrong version bump.
      - name: Check Conventional Commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          failed=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              "Merge "*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::Not a Conventional Commit: $subject"
              failed=1
            fi
          done < <(git rev-list "$base..$head")
          exit $failed

  sanitizers:
    name: Sanitizers (asan+ubsan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      # Core only: no Qt needed, so this job stays fast. The interesting races and
      # lifetime bugs all live in the data layer anyway.
      - name: Build and test with sanitizers
        run: cmake --workflow --preset asan-ubsan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1

  capi-build:
    name: capi (FFI) - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-22.04 }
          - { name: macOS (arm64), os: macos-26 }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Qt-free, like the sanitizer jobs above: capi-only links no Qt, so this
      # job needs no GUI-toolkit setup at all, and stays fast.
      - name: Build and test gbm_capi
        run: cmake --workflow --preset capi-only

      - name: Upload the built native library
        uses: actions/upload-artifact@v4
        with:
          name: gbm_capi-${{ matrix.os }}
          path: |
            build/capi-only/src/capi/libgbm_capi.so
            build/capi-only/src/capi/libgbm_capi.dylib
            build/capi-only/src/capi/gbm_capi.dll
          if-no-files-found: ignore

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capi-test-logs-${{ matrix.os }}
          path: |
            build/capi-only/Testing/**/*.log
          if-no-files-found: ignore

  flutter-ci:
    name: Flutter UI
    needs: capi-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        working-directory: app_flutter
        run: flutter pub get

      - name: flutter analyze
        working-directory: app_flutter
        run: flutter analyze

      # Pure-Dart tests only so far (see app_flutter/test/) -- no native
      # library needed. The real-FFI integration_test/ suite the plan
      # describes is added once Phase A's build wiring is exercised in CI
      # (this job, next step) for more than "does it build".
      - name: flutter test
        working-directory: app_flutter
        run: flutter test

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      # Proves the whole chain end to end: C++ core -> gbm_capi -> FFI
      # bindings -> a real Flutter Linux build, not just "the Dart compiles".
      # See app_flutter/scripts/build_capi.sh and the plan's Phase A/Phase B
      # build-integration note.
      - name: Build gbm_capi and bundle it
        run: app_flutter/scripts/build_capi.sh

      - name: flutter build linux
        working-directory: app_flutter
        run: flutter build linux --debug

  thread-sanitizer:
    name: Thread sanitizer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      # Snapshot publishing between the worker pool and the UI thread is exactly
      # where a data race would hide, and it would be near-impossible to reproduce
      # from a bug report.
      - name: Build and test with TSan
        run: cmake --workflow --preset tsan
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
