name: ci

on:
  pull_request:
    branches: [main]

# Without this the matrix queues for hours on a busy repository, and stale runs
# keep burning minutes after a force-push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: Sanitizers (asan+ubsan)
    runs-on: ubuntu-22.04
    # Every job carries one, and it is deliberately the same number for all of
    # them. A Windows capi run hung for 81 minutes here on a test that never
    # returned; with no job timeout it would have burned toward GitHub's 6-hour
    # default, and `flutter-ci` (then `needs: capi-build`) never ran at all.
    # The slowest measured job is Windows at 9-11 minutes, so 25 is over double the real
    # ceiling -- this guard is against the black hole, not against a slow run.
    # Per-job tuning would mean threading a `timeout` through `matrix.include`
    # for capi-build; not worth a second matrix dimension to save ten minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      # Core only: no Qt needed, so this job stays fast. The interesting races and
      # lifetime bugs all live in the data layer anyway.
      - name: Build and test with sanitizers
        run: cmake --workflow --preset asan-ubsan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1

  capi-build:
    name: capi (FFI) - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-22.04,   lib: libgbm_capi.so }
          - { name: macOS (arm64), os: macos-26, lib: libgbm_capi.dylib }
          - { name: Windows, os: windows-latest, lib: gbm_capi.dll }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Qt-free, like the sanitizer jobs above: capi-only links no Qt, so this
      # job needs no GUI-toolkit setup at all, and stays fast.
      - name: Build and test gbm_capi
        run: cmake --workflow --preset capi-only

      # TEMPORARY (#214), reverted once read: how often a stack overflow loses the crash line,
      # with which exit code, and how much stack the earlier filter had left, by frame size.
      - name: "Measure: stack overflow crash line (temporary)"
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/capi-only -Recurse -Filter gbm_crash_now.exe | Select-Object -First 1).FullName
          $tests = (Get-ChildItem build/capi-only -Recurse -Filter gbm_capi_tests.exe | Select-Object -First 1).FullName
          $env:GBM_CAPI_LIBRARY_PATH = (Resolve-Path build/capi-only/src/capi/gbm_capi.dll).Path
          $env:GBM_CRASH_NO_DIALOG = '1'
          $root = Join-Path $env:RUNNER_TEMP 'so-measure'
          $plan = [System.Collections.Generic.List[int]]::new()
          1..200 | ForEach-Object { $plan.Add(0) }
          foreach ($k in 0..63) { 1..4 | ForEach-Object { $plan.Add(4096 + 64 * $k) } }
          $rows = [System.Collections.Generic.List[object]]::new()
          $i = 0
          foreach ($frame in $plan) {
            $i++
            $dir = Join-Path $root "$i"
            New-Item -ItemType Directory -Force $dir | Out-Null
            $env:GBM_NATIVE_ERROR_LOG_DIR = $dir
            $env:GBM_CRASH_LOG = Join-Path $dir 'gbm-native-errors.log'
            $env:GBM_CRASH_MARKER = Join-Path $dir 'marker'
            $argv = if ($frame -eq 0) { @('--stack-overflow') } else { @('--stack-overflow', "$frame") }
            $p = Start-Process -FilePath $exe -ArgumentList $argv -PassThru -Wait -NoNewWindow
            $line = (Test-Path $env:GBM_CRASH_LOG) -and ((Get-Content -Raw $env:GBM_CRASH_LOG) -match 'code=0xc00000fd')
            $marker = if (Test-Path $env:GBM_CRASH_MARKER) { "$(Get-Content -Raw $env:GBM_CRASH_MARKER)" } else { 'missing' }
            $leftFile = "$($env:GBM_CRASH_MARKER).left"
            $left = if (Test-Path $leftFile) { "$(Get-Content -Raw $leftFile)" } else { '' }
            $rows.Add([pscustomobject]@{ frame = $frame; exit = ('0x{0:X8}' -f $p.ExitCode); line = $line; marker = $marker; left = $left })
          }
          '=== outcomes (count, exit/line/marker) over ' + $rows.Count + ' runs'
          $rows | Group-Object exit, line, marker | Sort-Object Count -Descending | ForEach-Object { '{0,5}  {1}' -f $_.Count, $_.Name }
          '=== runs that lost the line'
          $rows | Where-Object { -not $_.line } | Format-Table -AutoSize | Out-String -Width 200
          '=== stack left at the earlier filter, by frame size (0 = default)'
          $rows | Where-Object { $_.left } | Group-Object frame | ForEach-Object {
            $m = $_.Group | ForEach-Object { [int64]$_.left } | Measure-Object -Minimum -Maximum
            '{0,6}  n {1,3}  min {2,7}  max {3,7}' -f $_.Name, $_.Count, $m.Minimum, $m.Maximum
          }
          Remove-Item Env:GBM_NATIVE_ERROR_LOG_DIR, Env:GBM_CRASH_LOG, Env:GBM_CRASH_MARKER
          '=== the test itself, 200 repeats'
          & $tests --gtest_filter=CrashFilterApiTest.AStackOverflowIsLoggedWithNoBox --gtest_repeat=200 --gtest_brief=1 2>&1 | Select-String -Pattern 'exit code|FAILED|PASSED' | Select-Object -Last 40
          exit 0

      # In this job because the library it needs is the one just built: `flutter-ci`'s is built
      # without tests, and a job of its own would add only a wait and a transfer to the same
      # Flutter setup. It is the only place a real library meets Dart on Linux and Windows.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'

      - name: flutter pub get
        working-directory: app_flutter
        run: flutter pub get

      - name: Real library reports across FFI
        working-directory: app_flutter
        # The second file injects read failures through the same test-only exports.
        run: >-
          flutter test
          test/data/ffi/native_error_real_library_test.dart
          test/data/ffi/read_failure_real_library_test.dart
        env:
          GBM_CAPI_LIBRARY_PATH: ${{ github.workspace }}/build/capi-only/src/capi/${{ matrix.lib }}
          GBM_NATIVE_ERROR_LOG_DIR: ${{ runner.temp }}/gbm-native-errors
          # A crash here would otherwise wait on a box nobody clicks until the job timeout.
          GBM_CRASH_NO_DIALOG: '1'

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capi-test-logs-${{ matrix.os }}
          path: |
            build/capi-only/Testing/**/*.log
          if-no-files-found: ignore

  flutter-ci:
    name: Flutter UI - ${{ matrix.name }}
    # No `needs: capi-build`: this job consumes nothing that job produces
    # (`flutter build` compiles gbm_capi itself), so waiting on it only put
    # Windows capi's ~9-10 minutes in front of this job (#151 round).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Three OSes rather than ubuntu-22.04 alone. Two gaps closed, both of
    # which had been recorded as open rather than unknown:
    #
    #   * `windows/runner/` and `macos/Runner/` were compiled by nothing
    #     until a release tag, so an edit there reached main uncompiled
    #     (#69, closed by this matrix). `test/platform/window_title_test.dart`
    #     asserts those sources as *strings*, which catches a drifting
    #     literal and never a compile error.
    #   * the Dart unit/widget tier had no Windows job at all, which
    #     fix/windows-host-updater-tests named as its own open item after
    #     finding 58 red on a real Windows host that no tier could see.
    #
    # It also gives test/goldens/ an owner for the first time: every group
    # there carries `skip: !Platform.isMacOS`, so on an ubuntu-only job they
    # were verified by no tier at all -- only by accident, on whichever
    # developer happened to run the suite on a Mac.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,         os: ubuntu-22.04,   target: linux }
          - { name: macOS (arm64), os: macos-26,       target: macos }
          - { name: Windows,       os: windows-latest, target: windows }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      # Mandatory, not cosmetic: the GitHub Windows images ship a MinGW g++
      # on PATH as well as MSVC, and with no toolchain step CMake's compiler
      # probe takes whichever it finds first -- a job that omits this is not
      # "the same as the others", it is a different toolchain.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned rather than left to float on `stable` alone -- see the
          # "every flutter-action use must pin flutter-version" lint step:
          # `dart format`'s output is not stable across Dart SDK versions,
          # so an unpinned channel flaps files between two valid
          # formattings depending on which CI run last touched them.
          flutter-version: '3.47.4'

      - name: flutter pub get
        working-directory: app_flutter
        run: flutter pub get

      # Run on all three rather than Linux only: it costs ~25s and the
      # alternative is an `if:` whose premise ("the analyzer never varies by
      # host") nothing in this repo checks.
      - name: flutter analyze
        working-directory: app_flutter
        run: flutter analyze

      # Pure-Dart tests: no native library needed, which is why this runs
      # before the gbm_capi build below rather than after it.
      - name: flutter test
        working-directory: app_flutter
        run: flutter test

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      # Proves the whole chain end to end: C++ core -> gbm_capi -> FFI
      # bindings -> a real Flutter desktop build, not just "the Dart
      # compiles". `flutter build` compiles gbm_capi itself (Phase B:
      # linux/ and windows/CMakeLists.txt, macOS's "Build gbm_capi" Xcode
      # phase), so no build_capi.{sh,ps1} step runs first: its build/native/
      # copy was read by nothing after `flutter test`, and on Linux/Windows
      # it was a second full compile (59s / 127s measured, #151 round).
      - name: flutter build ${{ matrix.target }}
        working-directory: app_flutter
        run: flutter build ${{ matrix.target }} --debug

  thread-sanitizer:
    name: Thread sanitizer
    # ubuntu-24.04, not ubuntu-22.04 like the other sanitizer jobs: 22.04's
    # default GCC 11 + libtsan has a confirmed false-positive "double lock of
    # a mutex" on plain std::condition_variable::wait_for() usage -- reduced
    # to a ~30-line repro with no gbm_capi code at all (just std::mutex +
    # std::condition_variable + std::thread) that fails 100% of the time on
    # GCC 11 and passes 100% of the time on GCC 13, which 24.04 ships by
    # default. Not an application bug; a toolchain one.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lukka/get-cmake@latest

      # Snapshot publishing between the worker pool and the UI thread is exactly
      # where a data race would hide, and it would be near-impossible to reproduce
      # from a bug report.
      - name: Build and test with TSan
        run: cmake --workflow --preset tsan
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
