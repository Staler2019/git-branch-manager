name: cq

on:
  pull_request:
    branches: [main]

# Without this the matrix queues for hours on a busy repository, and stale runs
# keep burning minutes after a force-push.
concurrency:
  group: cq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release version is derived from commit messages, so a malformed one is
      # not cosmetic: it silently produces the wrong version bump.
      - name: Check Conventional Commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          failed=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              "Merge "*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::Not a Conventional Commit: $subject"
              failed=1
            fi
          done < <(git rev-list "$base..$head")
          exit $failed

  lint:
    name: Format and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang-format
        uses: jidicula/clang-format-action@v4.13.0
        with:
          clang-format-version: '18'
          check-path: 'src'

      # The core/capi split is the load-bearing structural decision: core must
      # stay free of any UI toolkit so the whole data layer is testable
      # headless. A grep is crude but it cannot be argued with, and it fails
      # fast. Historically this caught Qt specifically (src/app, since
      # removed in favour of the Flutter UI in app_flutter/); the rule itself
      # -- core never depends on whatever UI sits on top of it -- still holds.
      - name: core must not depend on Qt
        run: |
          if grep -rEn '#include\s*[<"]Q' src/core; then
            echo "::error::src/core must not include Qt headers - it is the headless, testable layer"
            exit 1
          fi
          echo "core is Qt-free"

      # Fixture git commands go through tests/support/GitCli.h, never a shell.
      # std::system() runs `/bin/sh -c` on POSIX and `cmd.exe /c` on Windows, so
      # every call costs a second process -- and the capi suite issued ~900 of
      # them, which is most of why that suite takes ten times longer on Windows
      # than on Linux (docs/reports/windows-process-cost.md). Building a command
      # *string* is also a real quoting hazard rather than a theoretical one:
      # BranchApiTest carried a five-line comment about single quotes surviving
      # cmd.exe and unquoted parentheses breaking dash. Both problems return the
      # moment someone adds one std::system() call back, and nothing else in CI
      # would notice -- the tests would still pass, just slower and more
      # fragile. Comment lines are allowed so the helper can explain itself.
      - name: tests must not shell out with std::system
        run: |
          if grep -rn 'std::system' tests --include='*.cpp' --include='*.h' \
              | grep -vE ':[[:space:]]*(//|\*)'; then
            echo "::error::tests must call gbm::testing::GitCli, not std::system - see tests/support/GitCli.h"
            exit 1
          fi
          echo "tests are shell-free"

      # subosito/flutter-action's `channel: stable` floats to whatever build
      # is current that day. dart format's output is not stable across Dart
      # SDK versions (CLAUDE.md's "Known gaps": a local Dart 3.12.2 and a CI
      # run on a newer stable each accept the other's output as "needs
      # reformatting", flapping a file between two valid formattings). Pin
      # every flutter-action use to an explicit flutter-version so all three
      # jobs run the same SDK the contributor formatted against.
      - name: every flutter-action use must pin flutter-version
        run: |
          failed=0
          for file in .github/workflows/*.yml; do
            for lineno in $(grep -n '^\s*- uses: subosito/flutter-action@' "$file" | cut -d: -f1); do
              # This step's `with:` block runs from `uses:` up to (but not
              # including) the next step (a `- uses:`/`- name:` line at the
              # same indentation) -- not a fixed line count, since the
              # block's own length grows whenever someone adds a comment.
              next_step=$(tail -n "+$((lineno + 1))" "$file" | grep -n '^\s*- \(uses\|name\):' | head -1 | cut -d: -f1)
              if [ -n "$next_step" ]; then
                end=$((lineno + next_step - 1))
              else
                end=$(wc -l < "$file")
              fi
              block=$(sed -n "${lineno},${end}p" "$file")
              if ! printf '%s' "$block" | grep -q 'flutter-version:'; then
                echo "::error file=$file,line=$lineno::subosito/flutter-action use has no flutter-version pin (channel: stable alone floats)"
                failed=1
              fi
            done
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "every flutter-action use pins flutter-version"

  # The generated PowerShell updater is the one artefact of this repository
  # that nothing else compiles, parses or runs. ci.yml's Flutter job is
  # ubuntu-only, windows/runner/ builds solely on a release tag (#69), and
  # update_installer_script_test.dart is @TestOn('mac-os || linux') because
  # there is no PowerShell to run the other half with. A syntax error in it
  # therefore reached users before it reached anyone else -- and it arrived
  # as "the app closed and never came back", since a parse failure happens
  # before the script's first statement and so before it can write a word of
  # its own transcript.
  #
  # Parse only, never execute: this script renames an install directory
  # aside, and running it on a CI machine is not a thing to do by accident.
  # It parses the checked-in golden rather than generating the script, which
  # keeps a whole Flutter toolchain off the Windows runner --
  # update_script_golden_test.dart is what stops the golden drifting from the
  # generator, and it fails on Linux long before this job would.
  powershell-parse:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # `powershell`, not `pwsh`: Windows PowerShell 5.1 is what `-File`
      # resolves to on a stock machine, so it is the parser whose opinion
      # decides whether a user's update runs.
      - name: Parse the generated updater script
        shell: powershell
        run: |
          $path = "app_flutter/test/fixtures/gbm-update.ps1.golden"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Output "::error file=$path,line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
            exit 1
          }
          Write-Output "$path parses clean ($($tokens.Count) tokens)"

  dart-format:
    name: Dart format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned rather than left to float on `stable` alone -- see the
          # "every flutter-action use must pin flutter-version" lint step:
          # `dart format`'s output is not stable across Dart SDK versions,
          # so an unpinned channel flaps files between two valid
          # formattings depending on which CI run last touched them.
          flutter-version: '3.44.9'

      - name: flutter pub get
        working-directory: app_flutter
        run: flutter pub get

      - name: dart format
        working-directory: app_flutter
        run: dart format --output=none --set-exit-if-changed .
