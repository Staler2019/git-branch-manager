name: perf-nightly

# The timing gate cannot live in ci.yml. tests/CMakeLists.txt already says why:
# a shared pull-request runner is far too noisy for timing assertions to gate
# a branch. Nightly on one pinned image instead, so a regression surfaces as a
# break in a trend rather than as a flaky red X on somebody's PR.
on:
  schedule:
    # Off the hour on purpose: GitHub's scheduler queues heavily at :00, and a
    # perf job that waits in a queue lands on a busier runner.
    - cron: '17 4 * * *'
  workflow_dispatch:

# No cancel-in-progress, unlike ci.yml: there is never a queue of these, and
# killing a run mid-measurement throws away a fixture build for nothing.
concurrency:
  group: perf-nightly

jobs:
  commit-graph-ratio:
    name: commit-graph speedup
    # Pinned, not -latest, for the same reason the sanitizer jobs in ci.yml
    # are pinned: a runner image rolling forward underneath a performance
    # trend makes the trend unreadable. One OS only -- this measures a
    # property of git and the walk, not of the platform.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and a pinned CMake
        uses: lukka/get-cmake@latest

      - name: Report the git version
        # GIT_CONFIG_COUNT is 2.31; gbm_graph_check's A/B mode refuses to
        # measure below that rather than silently reporting a false
        # regression -- see tests/tools/graph_check.cpp. Logged unconditionally
        # so a runner image bump that moves git shows up next to the numbers
        # it moved.
        run: git --version

      # core-only: the walk under test is Qt-free, so this skips the Qt
      # install and everything it drags in -- only the two binaries the gate
      # needs get built.
      - name: Configure and build
        run: |
          cmake --preset core-only
          # gbm_spawn_cost/gbm_exit_now are the windows-spawn-cost job's
          # binaries, built here too because `ctest --preset perf` selects by
          # label and would otherwise ask for a target this job never built.
          # Their Linux run prints verdict=not-applicable and exits 0 -- which
          # is the point: the non-Windows arm of that tool is then exercised
          # nightly instead of assumed to still compile.
          cmake --build --preset core-only \
            --target gen_history gbm_graph_check gbm_spawn_cost gbm_exit_now

      - name: Measure
        run: |
          set -o pipefail
          ctest --preset perf 2>&1 | tee perf.log

      # always(), including on failure: the numbers from the run that just
      # tripped the gate are the entire reason to open the summary.
      - name: Publish measurements
        if: always()
        run: |
          line=$(grep -m1 'commit-graph-ab:' perf.log || true)
          if [ -z "$line" ]; then
            {
              echo "## commit-graph speedup"
              echo
              echo 'No measurement line in `perf.log` -- the run failed before measuring.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            field() { sed -n "s/.*$1=\([0-9.]*\).*/\1/p" <<<"$line"; }
            {
              echo "## commit-graph speedup -- $(date -u '+%Y-%m-%d')"
              echo
              echo "git: $(git --version) - rows: $(field rows) - pairs: $(field pairs)"
              echo
              echo '| metric | graph off | graph on | speedup |'
              echo '|---|---|---|---|'
              printf '| full walk | %sms | %sms | **%sx** |\n' \
                "$(field off_total_ms)" "$(field on_total_ms)" "$(field total_speedup)"
              printf '| time to first chunk | %sms | %sms | %sx |\n' \
                "$(field off_first_ms)" "$(field on_first_ms)" "$(field first_speedup)"
              echo
              echo 'Gate is on the full walk only; time-to-first-chunk is reported for the trend.'
              echo
              echo '```'
              echo "$line"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Bottleneck #5 in docs/reports/vscode-graph-performance.md: track
          # GraphSnapshot's bytes/commit in CI while margin still exists, using
          # the same fixture this job already builds. Independent of the
          # speedup measurement above, so one failing does not hide the other.
          memLine=$(grep -m1 'graph-memory:' perf.log || true)
          if [ -n "$memLine" ]; then
            memField() { sed -n "s/.*$1=\([0-9.]*\).*/\1/p" <<<"$memLine"; }
            {
              echo
              echo "## GraphSnapshot memory -- $(date -u '+%Y-%m-%d')"
              echo
              echo '| rows | bytes/commit | budget | projected MB @ 500k |'
              echo '|---|---|---|---|'
              printf '| %s | %s | %s | %s |\n' \
                "$(memField rows)" "$(memField bytes_per_commit)" "$(memField budget)" \
                "$(memField projected_mb_500k)"
              echo
              echo '```'
              echo "$memLine"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-log
          path: perf.log
          if-no-files-found: ignore

  windows-spawn-cost:
    name: job-object spawn cost
    # Pinned for the same reason commit-graph-ratio is: a runner image rolling
    # forward underneath a trend makes the trend unreadable. windows-2022
    # specifically, because the subject is a Win32 kernel object and its cost
    # is a property of that image.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and a pinned CMake
        uses: lukka/get-cmake@latest

      - name: Report the git version
        run: git --version

      - name: Configure and build
        run: |
          cmake --preset core-only
          cmake --build --preset core-only --target gbm_spawn_cost gbm_exit_now

      # `-R` rather than the perf preset: the preset's other member builds a
      # 100k-commit fixture, and doing that on the slowest runner in the fleet
      # to measure something unrelated to it would be paying twice for nothing.
      - name: Measure
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/core-only -L perf -R windows_job_object_spawn_cost \
            --output-on-failure 2>&1 | tee spawn.log

      - name: Publish measurements
        if: always()
        shell: bash
        run: |
          line=$(grep -m1 'job-object-ab:' spawn.log || true)
          if [ -z "$line" ]; then
            {
              echo "## job-object spawn cost"
              echo
              echo 'No measurement line in `spawn.log` -- the run failed before measuring.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            verdict=$(sed -n 's/.*verdict=\([a-z-]*\).*/\1/p' <<<"$line")
            {
              echo "## job-object spawn cost -- $(date -u '+%Y-%m-%d')"
              echo
              echo "verdict: **$verdict**"
              echo
              # A point estimate is printed only when the tool says it earned
              # one. Below its own resolution it emits an upper bound instead,
              # and this summary must not quietly promote that to a number --
              # doing exactly that is how a previous round published "33%".
              case "$verdict" in
                measured)
                  echo 'The A/A null arm resolved this difference, and the injected-delay control'
                  echo 'recovered a known delay, so the overhead below is a real measurement.'
                  ;;
                below-noise)
                  echo 'Smaller than what this run could resolve. Only an **upper bound** is'
                  echo 'reported; there is no point estimate to quote.'
                  ;;
                instrument-unreliable)
                  echo 'The injected-delay control failed: the instrument could not recover a'
                  echo 'delay it was told the size of. **Do not quote any number from this run.**'
                  ;;
              esac
              echo
              echo '```'
              echo "$line"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawn-cost-log
          path: spawn.log
          if-no-files-found: ignore
