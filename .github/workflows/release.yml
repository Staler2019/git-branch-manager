name: release

# Packages the Flutter UI (app_flutter/) linked against gbm_capi -- the
# active UI since src/app (Qt) was removed once feature parity was reached
# (see docs/ARCHITECTURE.md). The Linux leg is verified end to end in this
# repository's own sandbox (a real `flutter build linux --release` producing
# a bundle with libgbm_capi.so inside it); the macOS and Windows legs are
# NOT -- there is no real macOS or Windows machine available where this was
# written, so treat their first real run with extra care and be ready to
# fix forward rather than assume they work as written.

on:
  push:
    branches: [main]
  # Building on the tag as well means a tag pushed by hand also produces artifacts.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- stage 1: derive the version and create the tag -----------------------
  tag:
    name: Derive version and tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
      changelog: ${{ steps.bump.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE TOKEN GOTCHA, and the reason this is worth spelling out: a tag pushed
      # with the default GITHUB_TOKEN does NOT trigger any workflow, because GitHub
      # suppresses recursive workflow triggers. This job therefore does not rely on
      # a tag trigger at all - it calls the build job directly via `needs`, which
      # sidesteps the problem entirely and needs no PAT or GitHub App.
      #
      # If you ever move to a separate `on: push: tags:` workflow, you must push the
      # tag with a GitHub App token (actions/create-github-app-token) or a PAT, and
      # add that identity to the branch-protection bypass list for main.
      - name: Compute the next version from Conventional Commits
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

  # --- stage 2: build and package for each platform -------------------------
  build:
    name: Package ${{ matrix.name }}
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than latest: it fixes the glibc floor for the
          # release artifact at 2.35, so binaries run on older distributions.
          - { name: Linux x86_64,  os: ubuntu-22.04,   arch: x86_64 }
          # Apple Silicon only, and one DMG rather than a universal binary: the
          # target platform is macOS on Apple Silicon, so an Intel slice would
          # be built and shipped for nobody.
          - { name: macOS arm64,   os: macos-26,       arch: arm64 }
          - { name: Windows x64,   os: windows-latest, arch: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.new_tag }}

      - uses: lukka/get-cmake@latest

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: flutter pub get
        working-directory: app_flutter
        run: flutter pub get

      # --- Linux: Phase B (linux/CMakeLists.txt) builds and bundles gbm_capi
      # automatically as part of `flutter build linux`. -------------------
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      # Pre-existing Flutter-tooling ordering quirk on a from-scratch build
      # directory (verified in this repository's own sandbox): the install
      # step looks for build/native_assets/linux before anything else has
      # created it. Unrelated to gbm_capi's own CMake integration.
      - name: flutter build linux
        if: runner.os == 'Linux'
        working-directory: app_flutter
        run: |
          mkdir -p build/native_assets/linux
          flutter build linux --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version="${{ needs.tag.outputs.new_version }}"
          name="git-branch-manager-${version}-linux-${{ matrix.arch }}"
          mkdir -p dist
          cp -r app_flutter/build/linux/x64/release/bundle "$name"
          tar czf "dist/${name}.tar.gz" "$name"
          rm -rf "$name"

      # --- Windows: Phase B (windows/CMakeLists.txt) builds and bundles
      # gbm_capi automatically as part of `flutter build windows`, mirroring
      # the Linux integration -- unverified on a real Windows machine (see
      # this file's header comment). -------------------------------------
      - name: flutter build windows
        if: runner.os == 'Windows'
        working-directory: app_flutter
        run: flutter build windows --release

      # Signed before packaging, not after: the zip just archives whatever is
      # on disk, so the binary has to already be signed for the zip to carry
      # a signed copy too.
      #
      # Skipped when the secrets are absent, so a fork's CI still goes green
      # instead of failing on something it cannot do -- same reasoning as the
      # macOS signing step below. The emptiness check lives in the script,
      # not `if`, since neither `secrets` nor `env` is available to a step's
      # own `if` condition.
      - name: Sign the application (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_CERT_PFX" ]; then
            echo "No signing certificate configured; shipping an unsigned build."
            exit 0
          fi
          echo "$WINDOWS_CERT_PFX" | base64 --decode > cert.pfx
          signtool sign /f cert.pfx /p "$WINDOWS_CERT_PASSWORD" /fd SHA256 \
            /tr http://timestamp.digicert.com /td SHA256 \
            "app_flutter/build/windows/x64/runner/Release/gbm_flutter.exe"
          rm -f cert.pfx
        continue-on-error: true

      # No NSIS installer yet, unlike the retired Qt pipeline -- authoring one
      # against Flutter's bundle layout needs a real Windows machine to
      # verify, which this was written without (see this file's header
      # comment). A plain zip matches Flutter's own documented distribution
      # guidance in the meantime.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.tag.outputs.new_version }}"
          $name = "git-branch-manager-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "app_flutter/build/windows/x64/runner/Release/*" -DestinationPath "dist/$name.zip"

      # --- macOS: no Phase B (the Xcode-based runner has no CMake build to
      # hook into the way linux/CMakeLists.txt and windows/CMakeLists.txt do
      # -- see scripts/build_capi.sh's doc comment), so gbm_capi is built
      # separately and copied into the .app bundle by hand. -----------------
      - name: Build gbm_capi (Phase A)
        if: runner.os == 'macOS'
        run: app_flutter/scripts/build_capi.sh

      - name: flutter build macos
        if: runner.os == 'macOS'
        working-directory: app_flutter
        run: flutter build macos --release

      # native_library.dart's second lookup candidate is "next to the running
      # executable" -- for a macOS .app that means Contents/MacOS/, alongside
      # gbm_flutter itself, which is where flutter build's own bundling never
      # places gbm_capi (there is no Phase B step to do it). Without this
      # copy the packaged .app fails to launch outside a repo checkout, since
      # native_library.dart's third candidate (build/native/ under the
      # current working directory) does not exist once the .app is moved
      # anywhere else.
      - name: Bundle gbm_capi into the .app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="app_flutter/build/macos/Build/Products/Release/gbm_flutter.app"
          cp build/capi-only/src/capi/libgbm_capi.dylib "$app/Contents/MacOS/"

      # Signing and notarization are skipped when the secrets are absent, so a
      # fork's CI still goes green instead of failing on something it cannot
      # do. The emptiness check lives in the script, not in `if`: neither the
      # `secrets` nor the `env` context is available to a step's own `if`
      # condition, so a condition written there would silently never match.
      #
      # The just-copied dylib needs its own signature before the bundle as a
      # whole is (re-)signed -- codesign --deep would otherwise sign it with
      # whatever ad-hoc identity Flutter's own build left in place, not the
      # real one.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app="app_flutter/build/macos/Build/Products/Release/gbm_flutter.app"
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "No signing certificate configured; shipping an unsigned build."
            exit 0
          fi
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions \
            build.keychain
          identity=$(security find-identity -v -p codesigning build.keychain | \
            grep -m1 -o '"[^"]*Developer ID Application[^"]*"' | tr -d '"')
          codesign --force --options runtime --sign "$identity" \
            "$app/Contents/MacOS/libgbm_capi.dylib"
          codesign --deep --force --options runtime --sign "$identity" "$app"
        continue-on-error: true

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version="${{ needs.tag.outputs.new_version }}"
          name="git-branch-manager-$version-macos-${{ matrix.arch }}"
          mkdir -p dist
          hdiutil create -volname "git-branch-manager" -srcfolder \
            "app_flutter/build/macos/Build/Products/Release/gbm_flutter.app" \
            -ov -format UDZO "dist/$name.dmg"

      - name: Notarize the DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            exit 0
          fi
          for dmg in dist/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          done
        continue-on-error: true

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: warn

  # --- stage 3: publish the release ----------------------------------------
  publish:
    name: Publish release
    needs: [tag, build]
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          body: ${{ needs.tag.outputs.changelog }}
          generate_release_notes: true
          files: artifacts/*
