# pre-commit install    # to enable
# pre-commit run --all-files   # to check everything now
#
# Pinned to the exact clang-format release CI's `lint` job checks against
# (.github/workflows/ci.yml, jidicula/clang-format-action@v4.13.0,
# clang-format-version: '18') so a passing local hook means a passing CI job.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        files: ^src/
