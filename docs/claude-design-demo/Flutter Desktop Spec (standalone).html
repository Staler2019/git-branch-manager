document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

          <sc-for list=\"{{ h.chips }}\" as=\"c\" hint-placeholder-count=\"1\">\n                    <span class=\"gbm-mono\" style=\"{{ c.style }}\">{{ c.label }}{{ c.icon }}<\u002Fspan>\n                  <\u002Fsc-for>\n                  <span class=\"gbm-mono\" style=\"{{ h.authorStyle }}\">{{ h.author }}<\u002Fspan>\n                  <span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary);flex-shrink:0;width:42px;text-align:right\">{{ h.date }}<\u002Fspan>\n                  <span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary);flex-shrink:0\">{{ h.hash }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"split-h\" style=\"position:relative\"><span class=\"cal cal-o\" style=\"left:16px;top:-7px\">7<\u002Fspan><\u002Fdiv>\n          <div style=\"height:126px;display:flex;flex-direction:column;border-top:0\">\n            <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center;background:var(--surface-sunken)\"><span class=\"cal\">8<\u002Fspan>Commit detail — commit description 在這裡看<\u002Fdiv>\n            <div style=\"padding:9px 12px;overflow:hidden;display:flex;flex-direction:column;gap:5px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Fix lane allocator overflow gutter<\u002Fdiv>\n              <div class=\"gbm-mono\" style=\"font-size:10.5px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap\">Lane colours now key off the lane's seed commit rather than\nthe lane index, so a branch keeps its colour across refresh.\n\nRefs: #482<\u002Fdiv>\n              <div style=\"display:flex;gap:12px;font-size:10px;color:var(--text-tertiary);margin-top:2px\">\n                <span>j.chen &lt;j.chen@example.com&gt;<\u002Fspan><span class=\"gbm-mono\">a1b2c3d<\u002Fspan><span>parents 7c3d9e2<\u002Fspan><span>2 files<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split-v\" style=\"position:relative\"><span class=\"cal cal-o\" style=\"left:-7px;top:14px\">9<\u002Fspan><\u002Fdiv>\n        <div class=\"mkpane\" style=\"width:186px;display:flex;flex-direction:column\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">10<\u002Fspan>Changed files<\u002Fdiv>\n          <div style=\"padding:6px;display:flex;flex-direction:column;gap:2px\">\n            <div class=\"gbm-row\" style=\"height:24px;font-size:10.5px\">{{ icFile }}<span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">LaneAllocator.h<\u002Fspan><span class=\"gbm-badge gbm-badge-added\">+12<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:24px;font-size:10.5px\">{{ icFile }}<span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">GraphBuilderTest<\u002Fspan><span class=\"gbm-badge gbm-badge-added\">+40<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;height:24px;padding:0 10px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);font-size:10.5px;color:var(--text-tertiary);min-width:1080px;box-sizing:border-box\">\n        <span class=\"cal\">11<\u002Fspan><span>main ↑2 ↓0<\u002Fspan><span>·<\u002Fspan><span>199,960 commits · 331 ms<\u002Fspan><span>·<\u002Fspan><span>48-lane limit<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:214px 1fr;gap:16px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"display:flex;align-items:baseline;gap:7px\"><span class=\"cal\">16<\u002Fspan><span style=\"font-size:12px;font-weight:600\">欄位選擇<\u002Fspan><\u002Fdiv>\n        <div class=\"gbm-menu\" style=\"min-width:0;padding:5px\">\n          <div style=\"font-size:9.5px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.05em;padding:3px 8px 5px\">Columns<\u002Fdiv>\n          <sc-for list=\"{{ graphCols }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <div class=\"gbm-menu-item\" style=\"cursor:default;gap:8px;opacity:{{ c.opacity }}\">\n              <span style=\"{{ c.box }}\"><\u002Fspan>\n              <span style=\"flex:1;min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.label }}<\u002Fspan>\n              <span class=\"gbm-menu-shortcut\">{{ c.hint }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:10.5px;color:var(--text-tertiary);line-height:1.7\">Graph 與 Message 固定不可關；其餘可自由開關並拖曳調整順序。<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gbm-panel\" style=\"padding:13px 15px;align-self:stretch\">\n        <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">自己的 commit 要看得出來<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85\">\n          Author 欄位比對 Preferences 的 <span class=\"gbm-mono\">user.email<\u002Fspan>（含 repository 層級的 override）。相符的列，author 以 <strong style=\"color:var(--accent)\">accent 色 + semibold<\u002Fstrong> 顯示，其餘作者維持 tertiary 灰。<br>\n          只亮 author 欄位，<strong style=\"color:var(--text-primary)\">不改整列底色<\u002Fstrong>——底色已經用於選取與 hover，再疊一層會讓選取狀態看不出來。<br>\n          比對用 email 不是姓名，因為同名不同信箱在多人專案很常見；一個人有多個信箱時可在 Preferences 追加，全部視為本人。<br>\n          此規則同樣套用到 Commit detail 面板與 Compare 分頁的 commits 欄。\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start\">\n      <div class=\"gbm-panel\" style=\"padding:13px 15px\">\n        <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">Graph 連線規則<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85\">\n          <strong style=\"color:var(--text-primary)\">目前開發中的分支永遠佔 lane 0，且是一條從頭到尾不轉折的直線。<\u002Fstrong>其他分支一律往右配置，轉折全部發生在支線那一側，主線不會為了讓路而歪掉。<br>\n          分岔與合併用貝茲曲線接進 lane 0，曲線的顏色屬於<strong style=\"color:var(--text-primary)\">支線<\u002Fstrong>，不是主線，這樣一眼看得出是誰併進來。<br>\n          Lane 顏色以該 lane 的<strong style=\"color:var(--text-primary)\">起始 commit<\u002Fstrong> 為 key，不是 lane 索引，所以捲動或重新整理後同一條分支顏色不變。<br>\n          超過 48 lane 時右側顯示 overflow 標記與實際被省略的分支數，不做無聲截斷。\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gbm-panel\" style=\"padding:13px 15px\">\n        <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">怎麼看出 local 與 origin 的位置<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85\">\n          位置由 commit 列上的 ref chip 表示。<strong style=\"color:var(--text-primary)\">local 與 origin 在同一個 commit 時只出一個 chip<\u002Fstrong>，尾端加一個雲朵圖示代表遠端也在這裡，不再另外寫一次 origin/ 前綴——同一件事寫兩遍只是佔寬度。<br>\n          <span class=\"gbm-mono\" style=\"font-size:9px;padding:1px 5px;border-radius:999px;background:var(--accent);color:var(--text-on-accent)\">feature/graph-lanes ☁<\u002Fspan> 實心加雲＝本機與遠端同步於此。<br>\n          <span class=\"gbm-mono\" style=\"font-size:9px;padding:1px 5px;border-radius:999px;background:var(--accent);color:var(--text-on-accent);box-shadow:0 0 0 2px var(--accent-subtle)\">HEAD → main<\u002Fspan> 實心加外光暈但<strong style=\"color:var(--text-primary)\">沒有雲<\u002Fstrong>＝目前 HEAD，且遠端不在這裡；該節點另套一圈外環。<br>\n          <span class=\"gbm-mono\" style=\"font-size:9px;padding:1px 5px;border-radius:999px;border:1px dashed var(--border-strong);color:var(--text-tertiary)\">origin/main<\u002Fspan> 虛線外框＝<strong style=\"color:var(--text-primary)\">只有在分歧時才會出現<\u002Fstrong>，標出遠端落在哪個 commit。<br>\n          所以看到虛線 chip 就代表有差距，兩個 chip 之間的節點數就是差幾個 commit；toolbar 的 ↑2 是同一件事的數字版。\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:13px 15px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">Commit description 在哪裡看（第 7 題）<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85\">\n        主要位置是 History 下方的 <strong style=\"color:var(--text-primary)\">Commit detail 面板（8）<\u002Fstrong>：subject 粗體單行，空一行後是完整 body，等寬字、保留原始換行、可選取複製；下方一列是 author / committer / hash / parents / 檔案數。<br>\n        次要位置三處：commit 列 hover 顯示 tooltip（只有 subject）；<span class=\"kbd\">Enter<\u002Fspan> 或雙擊 commit 開獨立 Commit detail 視窗（適合長 body 與 code review）；Working Copy 的 commit box 是<em>撰寫<\u002Fem> description 的地方（見 03）。\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:262px 1fr;gap:16px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"display:flex;align-items:baseline;gap:7px\">\n          <span class=\"cal\">15<\u002Fspan><span style=\"font-size:12px;font-weight:600\">Repository 切換彈窗<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:5px;padding:0 7px;height:26px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-panel-raised)\">\n          {{ icRepo }}<span style=\"flex:1;min-width:0;font-size:10.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">git-branch-manager<\u002Fspan>{{ icChevDown }}\n        <\u002Fdiv>\n        <div class=\"gbm-menu\" style=\"min-width:0;padding:5px\">\n          <div style=\"display:flex;align-items:center;gap:5px;height:25px;padding:0 7px;margin:1px 2px 4px;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--surface-panel)\">\n            {{ icSearch }}<span style=\"flex:1;min-width:0;font-size:10px;color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Search repositories<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"gbm-menu-item\" style=\"cursor:default;gap:7px\"><span style=\"display:inline-flex\">{{ icRepo }}<\u002Fspan><span style=\"flex:1;min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">git-branch-manager<\u002Fspan><span class=\"gbm-menu-shortcut\">↑2<\u002Fspan><\u002Fdiv>\n          <div class=\"gbm-menu-item\" style=\"cursor:default;gap:7px\"><span style=\"display:inline-flex\">{{ icRepo }}<\u002Fspan><span style=\"flex:1;min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">design-tokens<\u002Fspan><span class=\"gbm-menu-shortcut\">↓1<\u002Fspan><\u002Fdiv>\n          <div class=\"gbm-menu-item\" style=\"cursor:default;gap:7px\"><span style=\"display:inline-flex\">{{ icRepo }}<\u002Fspan><span style=\"flex:1;min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">infra-scripts<\u002Fspan><span class=\"gbm-menu-shortcut\"><\u002Fspan><\u002Fdiv>\n          <div class=\"gbm-menu-sep\"><\u002Fdiv>\n          <div class=\"gbm-menu-item\" style=\"cursor:default;gap:7px\"><span style=\"flex:1;min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Open repository…<\u002Fspan><span class=\"gbm-menu-shortcut\">Ctrl/Cmd+O<\u002Fspan><\u002Fdiv>\n          <div class=\"gbm-menu-item\" style=\"cursor:default;gap:7px\"><span style=\"flex:1;min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Clone repository…<\u002Fspan><span class=\"gbm-menu-shortcut\">Ctrl/Cmd+Shift+N<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:10.5px;color:var(--text-tertiary);line-height:1.7\">貼齊 sidebar 頂端按鈕下緣展開，寬度跟隨 sidebar。列上右鍵即 <a href=\"#\" sc-camel-on-click=\"{{ goP5 }}\">05-A<\u002Fa>。<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gbm-panel\" style=\"padding:13px 15px;align-self:stretch\">\n        <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">為什麼 repo 不跟 branches 放一起<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85\">\n          切 repo 是<strong style=\"color:var(--text-primary)\">低頻但影響整個視窗<\u002Fstrong>的動作；選分支是高頻且只影響中央內容。兩者混在同一份可捲動清單時，分支多的專案會把 repo 擠到看不見，而 repo 多的人每次找分支都要先捲過一段無關內容。<br>\n          拆開之後：sidebar 永遠只描述<strong style=\"color:var(--text-primary)\">目前這個 repo<\u002Fstrong>，四段結構固定不變，Ctrl/Cmd+Shift+E 的 branch filter 也只需要處理分支語意；repo 則收進一顆常駐顯示目前位置的按鈕，按 Ctrl/Cmd+R 隨時叫出，選完即關。<br>\n          彈窗而非 modal dialog：切 repo 不需要中斷式的確認，Esc 關閉即回到原狀，不改變任何狀態。\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start\">\n      <div>\n        <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">分支狀態圖示（local 與 remote 合併成一份清單）<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr .5fr 1.85fr\" class=\"tbl\">\n          <div class=\"th\"><\u002Fdiv><div class=\"th\">狀態<\u002Fdiv><div class=\"th\">Badge<\u002Fdiv><div class=\"th\">說明<\u002Fdiv>\n          <sc-for list=\"{{ branchStates }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div class=\"td\" style=\"display:flex;justify-content:center\">{{ b.glyph }}<\u002Fdiv>\n            <div class=\"td\" style=\"color:var(--text-primary)\">{{ b.st }}<\u002Fdiv>\n            <div class=\"td gbm-mono\" style=\"font-size:10.5px\">{{ b.badge }}<\u002Fdiv>\n            <div class=\"td\">{{ b.note }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gbm-panel\" style=\"padding:13px 15px\">\n        <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">分支資料夾<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85\">\n          名稱中的 <span class=\"gbm-mono\">/<\u002Fspan> 自動摺成資料夾，<span class=\"gbm-mono\">feature/graph-lanes<\u002Fspan> 顯示為 feature 底下的 graph-lanes。純顯示層行為，不改動 git 的 ref 名稱。<br>\n          資料夾列顯示底下的分支數，可收合，收合狀態記憶在該 repo。多層斜線就多層縮排，深度不設限。<br>\n          資料夾本身也能右鍵：對整個資料夾 Fetch、或一次刪除底下所有已合併的分支，dialog 會逐條列出將被刪的名稱。<br>\n          Filter 有輸入內容時，資料夾自動全展開；清空後回到原本的收合狀態。\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:13px 15px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">遠端分支被刪除時怎麼看得到<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85\">\n        Fetch 之後若遠端已不存在該分支，<strong style=\"color:var(--text-primary)\">不會直接從 sidebar 消失<\u002Fstrong>——靜默移除會讓人以為自己看錯。改為三段式：<br>\n        1. <strong style=\"color:var(--text-primary)\">Remotes 區<\u002Fstrong>該列轉半透明、名稱加刪除線、圖示換成 <span class=\"gbm-mono\">cloud-off<\u002Fspan>，並在區塊標題右邊顯示待清理數量。<br>\n        2. 追蹤它的<strong style=\"color:var(--text-primary)\">本機分支<\u002Fstrong>掛上 <span style=\"font-size:9px;color:var(--warning);border:1px solid var(--warning);border-radius:3px;padding:0 3px\">gone<\u002Fspan> 標記，代表 upstream 已消失，status bar 的 ahead/behind 改顯示 <span class=\"gbm-mono\">upstream gone<\u002Fspan>。<br>\n        3. 使用者自己按 <span class=\"gbm-mono\">Remote → Prune remote branches<\u002Fspan> 才真的移除，dialog 會列出每一條將被清掉的名稱。<br>\n        自己執行 05-C 的 Delete on remote 時同樣走這個顯示狀態，並在 status bar 留一則 <span class=\"gbm-mono\">Deleted origin/graph-lanes<\u002Fspan> 的訊息，附 Undo（重新 push 同名分支）。\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1.25fr 1.15fr .8fr 1.9fr\" class=\"tbl\">\n      <div class=\"th\"><\u002Fdiv><div class=\"th\">元件<\u002Fdiv><div class=\"th\">Menu bar 位置<\u002Fdiv><div class=\"th\">Shortcut<\u002Fdiv><div class=\"th\">說明<\u002Fdiv>\n      <sc-for list=\"{{ p2rows }}\" as=\"r\" hint-placeholder-count=\"16\">\n        <div class=\"td\" style=\"text-align:center\"><span class=\"cal\">{{ r.n }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\" style=\"color:var(--text-primary)\">{{ r.el }}<\u002Fdiv>\n        <div class=\"td\">{{ r.menu }}<\u002Fdiv>\n        <div class=\"td\"><span class=\"kbd\">{{ r.key }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\">{{ r.note }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P3 working copy ══ -->\n  <sc-if value=\"{{ isP3 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"mock\">\n      <div class=\"mkbar\"><span>File<\u002Fspan><span>Edit<\u002Fspan><span>View<\u002Fspan><span>Repository<\u002Fspan><span>Branch<\u002Fspan><span>Remote<\u002Fspan><span>Help<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;height:352px\">\n        <div class=\"mkpane\" style=\"width:150px\"><div class=\"mklbl\">Sidebar<\u002Fdiv><\u002Fdiv>\n        <div class=\"split-v\"><\u002Fdiv>\n        <div class=\"mkpane\" style=\"flex:1;display:flex;flex-direction:column\">\n          <div class=\"gbm-tabs\" style=\"padding:0 8px;gap:2px;align-items:center;background:var(--surface-panel-raised)\">\n            <span class=\"cal\" style=\"margin-right:4px\">9<\u002Fspan>\n            <span class=\"gbm-tab\" style=\"font-size:11.5px;padding:6px 10px\">History<\u002Fspan>\n            <span class=\"gbm-tab active\" style=\"font-size:11.5px;padding:6px 10px\">Working Copy<\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <span class=\"gbm-badge gbm-badge-neutral\" style=\"margin-bottom:4px\">3<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;height:170px\">\n            <div class=\"mkpane\" style=\"flex:1;display:flex;flex-direction:column\">\n              <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">1<\u002Fspan><span style=\"flex:1\">Unstaged · 2<\u002Fspan><span class=\"cal\">10<\u002Fspan><span style=\"display:inline-flex;gap:2px;padding:1px;border:1px solid var(--border-default);border-radius:var(--radius-sm)\"><span style=\"display:inline-flex;padding:2px;border-radius:2px\">{{ icList }}<\u002Fspan><span style=\"display:inline-flex;padding:2px;border-radius:2px;background:var(--accent)\">{{ icTree }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n              <div style=\"padding:6px;display:flex;flex-direction:column;gap:1px\">\n                <div class=\"gbm-row\" style=\"height:22px;font-size:10px;gap:4px;padding-left:6px\">{{ icChevDown }}<span style=\"color:var(--text-secondary)\">lib/app/views<\u002Fspan><span class=\"gbm-badge gbm-badge-neutral\" style=\"font-size:9px\">2<\u002Fspan><\u002Fdiv>\n                <div class=\"gbm-row\" style=\"height:24px;font-size:10.5px;padding-left:19px\"><span class=\"gbm-checkbox\" style=\"width:12px;height:12px\"><\u002Fspan><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">MainWindow.dart<\u002Fspan><span class=\"gbm-badge gbm-badge-added\">+34<\u002Fspan><\u002Fdiv>\n                <div class=\"gbm-row\" style=\"height:24px;font-size:10.5px;padding-left:19px\"><span class=\"gbm-checkbox\" style=\"width:12px;height:12px\"><\u002Fspan><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">context_menu.dart<\u002Fspan><span class=\"gbm-badge gbm-badge-added\">+120<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin:auto 10px 10px;padding:7px;border:1px dashed var(--border-default);border-radius:var(--radius-md);font-size:10px;color:var(--text-tertiary);text-align:center\">拖曳檔案到右欄 = stage<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"split-v\" style=\"position:relative\"><span class=\"cal cal-o\" style=\"left:-7px;top:12px\">2<\u002Fspan><\u002Fdiv>\n            <div class=\"mkpane\" style=\"flex:1;display:flex;flex-direction:column\">\n              <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">3<\u002Fspan>Staged · 1<\u002Fdiv>\n              <div style=\"padding:6px\">\n                <div class=\"gbm-row\" style=\"height:25px;font-size:10.5px\"><span class=\"gbm-checkbox checked\" style=\"width:12px;height:12px\"><\u002Fspan><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">LaneAllocator.dart<\u002Fspan><span class=\"gbm-badge gbm-badge-added\">+12<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"split-h\" style=\"position:relative\"><span class=\"cal cal-o\" style=\"left:16px;top:-7px\">4<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;display:flex;flex-direction:column;min-height:0\">\n            <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">5<\u002Fspan>Diff — 逐行 stage<\u002Fdiv>\n            <div style=\"flex:1;overflow:hidden;padding:2px 0\">\n              <div class=\"gbm-diffline gbm-diffline-hunk\" style=\"font-size:10.5px\">@@ -40,3 +40,3 @@<\u002Fdiv>\n              <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10.5px;display:flex;gap:8px;align-items:center\"><span class=\"gbm-checkbox\" style=\"width:11px;height:11px;visibility:hidden\"><\u002Fspan><span style=\"opacity:.45\">40<\u002Fspan>    for (final lane in lanes) {<\u002Fdiv>\n              <div class=\"gbm-diffline gbm-diffline-del\" style=\"font-size:10.5px;display:flex;gap:8px;align-items:center\"><span class=\"gbm-checkbox checked\" style=\"width:11px;height:11px\"><\u002Fspan><span style=\"opacity:.45\">41<\u002Fspan>−     if (lane.free) return lane.index;<\u002Fdiv>\n              <div class=\"gbm-diffline gbm-diffline-add\" style=\"font-size:10.5px;display:flex;gap:8px;align-items:center\"><span class=\"gbm-checkbox\" style=\"width:11px;height:11px\"><\u002Fspan><span style=\"opacity:.45\">41<\u002Fspan>+     if (lane.free &amp;&amp; lane.seed != commit) return lane.index;<\u002Fdiv>\n              <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10.5px;display:flex;gap:8px;align-items:center\"><span class=\"gbm-checkbox\" style=\"width:11px;height:11px;visibility:hidden\"><\u002Fspan><span style=\"opacity:.45\">42<\u002Fspan>    }<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--border-subtle);padding:9px 11px;display:flex;gap:9px;align-items:flex-start;background:var(--surface-panel-raised)\">\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:5px\">\n              <div style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">6<\u002Fspan><input class=\"gbm-input\" style=\"height:25px;font-size:11px\" placeholder=\"Summary（50 字內，subject 行）\"><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;align-items:flex-start\"><span class=\"cal\">7<\u002Fspan><div style=\"flex:1;height:40px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-panel);padding:6px 8px;font-size:10.5px;color:var(--text-tertiary);font-family:var(--font-mono)\">Description（body，可多行；72 字換行提示尺標）<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px;align-items:stretch\"><span class=\"cal\" style=\"align-self:flex-end\">8<\u002Fspan><button class=\"gbm-btn gbm-btn-primary gbm-btn-sm\">Commit 1<\u002Fbutton><button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Amend<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"gbm-panel\" style=\"padding:13px 15px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">可以一起 stage / unstage 的選取範圍<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85\">\n        六種 scope 共用同一組動作：<span class=\"kbd\">Space<\u002Fspan> 切換、右鍵選單、或拖到另一欄。選取狀態跨 scope 不混用——一旦點到 diff 的行，檔案清單的多選就清空，避免「到底要 stage 什麼」不明確。<br>\n        任何一次動作的按鈕與選單文字都會寫出<strong style=\"color:var(--text-primary)\">實際數量<\u002Fstrong>（Stage 3 files、Stage 12 lines），不會只寫 Stage。\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.15fr .95fr 1.9fr\" class=\"tbl\">\n      <div class=\"th\">Scope<\u002Fdiv><div class=\"th\">怎麼選<\u002Fdiv><div class=\"th\">Shortcut<\u002Fdiv><div class=\"th\">說明<\u002Fdiv>\n      <sc-for list=\"{{ scopes }}\" as=\"s\" hint-placeholder-count=\"7\">\n        <div class=\"td\" style=\"color:var(--text-primary)\">{{ s.scope }}<\u002Fdiv>\n        <div class=\"td\">{{ s.how }}<\u002Fdiv>\n        <div class=\"td\"><span class=\"kbd\">{{ s.key }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\">{{ s.note }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:34px 1.25fr 1.15fr .8fr 1.9fr\" class=\"tbl\">\n      <div class=\"th\"><\u002Fdiv><div class=\"th\">元件<\u002Fdiv><div class=\"th\">Menu bar 位置<\u002Fdiv><div class=\"th\">Shortcut<\u002Fdiv><div class=\"th\">說明<\u002Fdiv>\n      <sc-for list=\"{{ p3rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n        <div class=\"td\" style=\"text-align:center\"><span class=\"cal\">{{ r.n }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\" style=\"color:var(--text-primary)\">{{ r.el }}<\u002Fdiv>\n        <div class=\"td\">{{ r.menu }}<\u002Fdiv>\n        <div class=\"td\"><span class=\"kbd\">{{ r.key }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\">{{ r.note }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P4 menu bar ══ -->\n  <sc-if value=\"{{ isP4 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel\" style=\"padding:13px 15px;font-size:12px;color:var(--text-secondary);line-height:1.85\">\n      Shortcut 一律寫成 <span class=\"kbd\">Ctrl/Cmd<\u002Fspan>：Windows 與 Linux 讀左邊，macOS 讀右邊。Flutter 端用同一份 <span class=\"gbm-mono\">SingleActivator<\u002Fspan> 表，依 <span class=\"gbm-mono\">Platform.isMacOS<\u002Fspan> 決定 <span class=\"gbm-mono\">meta<\u002Fspan> 或 <span class=\"gbm-mono\">control<\u002Fspan>；macOS 另外把 About / Preferences / Quit 交給系統應用選單。\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n      <sc-for list=\"{{ menuCols }}\" as=\"m\" hint-placeholder-count=\"7\">\n        <div class=\"gbm-panel\" style=\"overflow:hidden;align-self:start\">\n          <div style=\"padding:8px 11px;border-bottom:1px solid var(--border-subtle);background:var(--surface-sunken);font-size:11.5px;font-weight:600\">{{ m.title }}<\u002Fdiv>\n          <div style=\"padding:5px\">\n            <sc-for list=\"{{ m.items }}\" as=\"i\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:5px 8px;font-size:11.5px;border-radius:var(--radius-sm);color:{{ i.color }}\">\n                <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ i.label }}<\u002Fspan>\n                <span class=\"gbm-menu-shortcut\">{{ i.key }}<\u002Fspan>\n                <span class=\"gbm-menu-submenu-arrow\" style=\"display:inline-flex\">{{ i.arrow }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P5 context menus ══ -->\n  <sc-if value=\"{{ isP5 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel\" style=\"padding:13px 15px;font-size:12px;color:var(--text-secondary);line-height:1.85\">\n      共 11 種右鍵目標。最上層一律扁平、最多 8 項；超過的收進 <strong style=\"color:var(--text-primary)\">More actions<\u002Fstrong> 第二層（項目右側帶 chevron-right）。第二層只有一階，不再往下。破壞性動作永遠在最後、以分隔線隔開、用 danger 色。Flutter 用 <span class=\"gbm-mono\">MenuAnchor<\u002Fspan> + <span class=\"gbm-mono\">SubmenuButton<\u002Fspan>，以 <span class=\"gbm-mono\">onSecondaryTapDown<\u002Fspan> 的座標開啟。\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px;align-items:start\">\n      <sc-for list=\"{{ ctxMenus }}\" as=\"c\" hint-placeholder-count=\"11\">\n        <div style=\"display:flex;flex-direction:column;gap:7px\">\n          <div style=\"display:flex;align-items:baseline;gap:7px\">\n            <span class=\"gbm-mono\" style=\"font-size:10px;color:var(--accent)\">{{ c.id }}<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600\">{{ c.title }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:10.5px;color:var(--text-tertiary);line-height:1.6\">{{ c.target }}<\u002Fdiv>\n          <div class=\"gbm-menu\" style=\"position:relative;min-width:0\">\n            <sc-for list=\"{{ c.items }}\" as=\"i\" hint-placeholder-count=\"6\">\n              <div class=\"gbm-menu-item {{ i.cls }}\" style=\"cursor:default\">\n                <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ i.label }}<\u002Fspan>\n                <span class=\"gbm-menu-shortcut\">{{ i.key }}<\u002Fspan>\n                <span class=\"gbm-menu-submenu-arrow\" style=\"display:inline-flex\">{{ i.arrow }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ c.hasSub }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"gbm-menu\" style=\"position:absolute;left:88%;top:52%;min-width:186px;z-index:4\">\n                <sc-for list=\"{{ c.sub }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div class=\"gbm-menu-item {{ s.cls }}\" style=\"cursor:default\"><span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ s.label }}<\u002Fspan><span class=\"gbm-menu-shortcut\">{{ s.key }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P6 dialogs ══ -->\n  <sc-if value=\"{{ isP6 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel\" style=\"padding:13px 15px;font-size:12px;color:var(--text-secondary);line-height:1.85\">\n      所有 dialog 共用同一個殼：標題列（18px semibold）+ 內容區（16px padding、欄位垂直排列）+ 底部動作列（右對齊，主要動作最右）。<span class=\"kbd\">Esc<\u002Fspan> 取消、<span class=\"kbd\">Enter<\u002Fspan> 執行主要動作。破壞性 dialog 的主要按鈕用 danger 樣式，且必須複述具體對象（分支名、檔案數），不能只寫「確定嗎」。<br>\n      <strong style=\"color:var(--text-primary)\">Repository settings 已從主視窗中央移除（第 6 題）<\u002Fstrong>，改為 dialog：<span class=\"gbm-mono\">Repository → Settings…<\u002Fspan>。主視窗中央因此只剩 History 與 Working Copy 兩個分頁。\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n      <div class=\"gbm-panel-raised\" style=\"border:1px solid var(--border-default);overflow:hidden\">\n        <div style=\"padding:12px 15px;border-bottom:1px solid var(--border-subtle);font-size:13px;font-weight:600\">Repository settings<\u002Fdiv>\n        <div style=\"padding:14px 15px;display:flex;flex-direction:column;gap:11px\">\n          <div class=\"gbm-tabs\" style=\"gap:2px\"><span class=\"gbm-tab active\">General<\u002Fspan><span class=\"gbm-tab\">Remotes<\u002Fspan><span class=\"gbm-tab\">Identity<\u002Fspan><span class=\"gbm-tab\">Performance<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--text-secondary)\">Default branch<\u002Fdiv>\n          <input class=\"gbm-input\" style=\"height:27px;font-size:11.5px\" value=\"main\">\n          <div style=\"font-size:11px;color:var(--text-secondary)\">Large-repository mode<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;font-size:11.5px\"><span class=\"gbm-checkbox checked\" style=\"width:13px;height:13px\"><\u002Fspan>分頁載入 history，不一次建整張圖<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:11px 15px;border-top:1px solid var(--border-subtle);display:flex;justify-content:flex-end;gap:7px\">\n          <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Cancel<\u002Fbutton><button class=\"gbm-btn gbm-btn-primary gbm-btn-sm\">Save<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gbm-panel-raised\" style=\"border:1px solid var(--border-default);overflow:hidden;align-self:start\">\n        <div style=\"padding:12px 15px;border-bottom:1px solid var(--border-subtle);font-size:13px;font-weight:600\">Delete branch<\u002Fdiv>\n        <div style=\"padding:14px 15px;font-size:12px;color:var(--text-secondary);line-height:1.8\">\n          刪除本機分支 <span class=\"gbm-mono\" style=\"color:var(--text-primary)\">feature/graph-lanes<\u002Fspan>。<br>該分支有 3 個 commit 尚未合併到 main，刪除後只能透過 reflog 找回。\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:11px;font-size:11.5px\"><span class=\"gbm-checkbox\" style=\"width:13px;height:13px\"><\u002Fspan>同時刪除遠端 origin/feature/graph-lanes<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:11px 15px;border-top:1px solid var(--border-subtle);display:flex;justify-content:flex-end;gap:7px\">\n          <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Cancel<\u002Fbutton><button class=\"gbm-btn gbm-btn-danger gbm-btn-sm\">Delete branch<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.15fr 1.1fr .8fr 2fr\" class=\"tbl\">\n      <div class=\"th\">Dialog<\u002Fdiv><div class=\"th\">開啟位置<\u002Fdiv><div class=\"th\">Shortcut<\u002Fdiv><div class=\"th\">內容與規則<\u002Fdiv>\n      <sc-for list=\"{{ dialogs }}\" as=\"d\" hint-placeholder-count=\"12\">\n        <div class=\"td\" style=\"color:var(--text-primary)\">{{ d.name }}<\u002Fdiv>\n        <div class=\"td\">{{ d.from }}<\u002Fdiv>\n        <div class=\"td\"><span class=\"kbd\">{{ d.key }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\">{{ d.note }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P7 clean / conflict ══ -->\n  <sc-if value=\"{{ isP7 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;background:var(--success)\"><\u002Fspan>Clean<\u002Fdiv>\n        <div class=\"mock\">\n          <div class=\"mkbar\" style=\"height:34px;gap:6px\"><button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Fetch<\u002Fbutton><button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Pull<\u002Fbutton><button class=\"gbm-btn gbm-btn-primary gbm-btn-sm\">Push<\u002Fbutton><span style=\"flex:1\"><\u002Fspan><span style=\"font-size:10.5px;color:var(--text-tertiary)\">無 banner<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:13px;font-size:11.5px;color:var(--text-secondary);line-height:1.8\">沒有進行中的 sequencer 作業，working tree 沒有 <span class=\"gbm-mono\">UU / AA / DD<\u002Fspan> 狀態的檔案。<br>全部功能可用，Commit / Push / 切分支不受限。<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;height:22px;padding:0 10px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);font-size:10px;color:var(--text-tertiary)\">main ↑2 ↓0 · clean<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;background:var(--danger)\"><\u002Fspan>Conflict<\u002Fdiv>\n        <div class=\"mock\">\n          <div class=\"mkbar\" style=\"height:34px;gap:6px\"><button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\" disabled=\"{{ true }}\">Fetch<\u002Fbutton><button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\" disabled=\"{{ true }}\">Pull<\u002Fbutton><button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\" disabled=\"{{ true }}\">Push<\u002Fbutton><span style=\"flex:1\"><\u002Fspan><span style=\"font-size:10.5px;color:var(--danger)\">操作受限<\u002Fspan><\u002Fdiv>\n          <div class=\"gbm-banner gbm-banner-warning\" style=\"font-size:11px;gap:8px\">{{ icAlert }}<span style=\"flex:1\">Rebase 進行中 — 已套用 3 / 8，2 個檔案衝突<\u002Fspan><button class=\"gbm-btn gbm-btn-sm gbm-btn-secondary\">Abort<\u002Fbutton><button class=\"gbm-btn gbm-btn-sm gbm-btn-primary\">Resolve…<\u002Fbutton><\u002Fdiv>\n          <div style=\"padding:13px;font-size:11.5px;color:var(--text-secondary);line-height:1.8\">merge / rebase / cherry-pick / revert 中斷。<br>Push / Pull / 切分支停用，<span class=\"gbm-mono\">Continue<\u002Fspan> 需先解完全部衝突。<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;height:22px;padding:0 10px;border-top:1px solid var(--border-subtle);background:var(--diff-del-bg);font-size:10px;color:var(--diff-del-text)\">REBASE 3/8 · 2 conflicted<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.15fr 1.15fr\" class=\"tbl\">\n      <div class=\"th\">面向<\u002Fdiv><div class=\"th\">Clean<\u002Fdiv><div class=\"th\">Conflict<\u002Fdiv>\n      <sc-for list=\"{{ stateRows }}\" as=\"s\" hint-placeholder-count=\"8\">\n        <div class=\"td\" style=\"color:var(--text-primary)\">{{ s.k }}<\u002Fdiv>\n        <div class=\"td\">{{ s.clean }}<\u002Fdiv>\n        <div class=\"td\">{{ s.conflict }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P8 conflict window ══ -->\n  <sc-if value=\"{{ isP8 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel\" style=\"padding:13px 15px;font-size:12px;color:var(--text-secondary);line-height:1.85\">\n      <strong style=\"color:var(--text-primary)\">獨立的 top-level 視窗<\u002Fstrong>（第 5 題）：主視窗保持可用，可以邊解衝突邊看 history。多螢幕時預設開在主視窗所在螢幕的中央，記憶尺寸與四條分割線位置。關閉視窗不等於放棄，狀態留在 working tree。\n    <\u002Fdiv>\n    <div class=\"mock\" style=\"overflow-x:auto\">\n      <div style=\"display:flex;align-items:center;height:29px;padding:0 10px;background:var(--surface-sunken);border-bottom:1px solid var(--border-subtle);min-width:1080px\">\n        <span style=\"flex:1;font-size:11px;color:var(--text-secondary)\">Resolve conflicts — LaneAllocator.dart (1 / 2)<\u002Fspan>\n        <span style=\"display:flex;gap:12px;align-items:center\">{{ icMin }}{{ icSq }}{{ icClose }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;height:352px;min-width:1080px\">\n        <div class=\"mkpane\" style=\"width:158px;display:flex;flex-direction:column\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">1<\u002Fspan>Conflicted files<\u002Fdiv>\n          <div style=\"padding:6px;display:flex;flex-direction:column;gap:2px\">\n            <div class=\"gbm-row selected\" style=\"height:27px;font-size:10.5px;gap:6px\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--danger)\"><\u002Fspan><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">LaneAllocator.dart<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">2<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:27px;font-size:10.5px;gap:6px\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--danger)\"><\u002Fspan><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">graph_builder.dart<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">1<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:27px;font-size:10.5px;gap:6px;opacity:.55\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--success)\"><\u002Fspan><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">lane_test.dart<\u002Fspan>{{ icCheck }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split-v\" style=\"position:relative\"><span class=\"cal cal-o\" style=\"left:-7px;top:12px\">2<\u002Fspan><\u002Fdiv>\n\n        <div class=\"mkpane\" style=\"flex:1;display:flex;flex-direction:column;min-width:0\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">3<\u002Fspan>LEFT — ours (HEAD, main)<\u002Fdiv>\n          <div style=\"flex:1;overflow:hidden;position:relative\">\n            <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10px\">40  for (final lane in lanes) {<\u002Fdiv>\n            <div style=\"position:relative;background:var(--diff-del-bg)\">\n              <div class=\"gbm-diffline\" style=\"font-size:10px;color:var(--diff-del-text)\">41    if (lane.free) {<\u002Fdiv>\n              <div class=\"gbm-diffline\" style=\"font-size:10px;color:var(--diff-del-text)\">42      return lane.index;<\u002Fdiv>\n              <div style=\"position:absolute;right:5px;top:4px;display:flex;gap:3px;align-items:center\">\n                <span class=\"cal\" style=\"background:var(--surface-overlay);color:var(--accent);border:1px solid var(--accent);width:16px;height:16px\">4<\u002Fspan>\n                <span style=\"display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:var(--radius-sm);background:var(--accent);box-shadow:var(--shadow-md)\">{{ icArrowR }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10px\">43  }<\u002Fdiv>\n            <div style=\"position:absolute;left:8px;bottom:7px;font-size:9.5px;color:var(--text-tertiary)\">hover hunk → 出現套用鈕，也可直接拖到中欄<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split-v\" style=\"position:relative\"><span class=\"cal cal-o\" style=\"left:-7px;top:12px\">5<\u002Fspan><\u002Fdiv>\n\n        <div class=\"mkpane\" style=\"flex:1.12;display:flex;flex-direction:column;min-width:0;background:var(--surface-panel-raised)\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center;background:var(--surface-sunken)\"><span class=\"cal\">6<\u002Fspan>RESULT — 合併後的檔案<\u002Fdiv>\n          <div style=\"flex:1;overflow:hidden;position:relative\">\n            <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10px\">40  for (final lane in lanes) {<\u002Fdiv>\n            <div style=\"position:relative;background:var(--diff-del-bg);display:flex;align-items:center;gap:5px;padding-right:5px\">\n              <span class=\"gbm-diffline\" style=\"font-size:10px;color:var(--diff-del-text);flex:1;min-width:0\">41    if (lane.free) {<\u002Fspan>\n              <span class=\"gbm-mono\" style=\"font-size:9px;color:var(--text-on-accent);background:var(--accent);border-radius:999px;padding:0 5px\">①<\u002Fspan>\n              <span style=\"display:inline-flex;cursor:pointer\">{{ icX }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:relative;background:var(--diff-add-bg);display:flex;align-items:center;gap:5px;padding-right:5px\">\n              <span class=\"gbm-diffline\" style=\"font-size:10px;color:var(--diff-add-text);flex:1;min-width:0\">42    if (lane.free &amp;&amp; lane.seed != c) {<\u002Fspan>\n              <span class=\"gbm-mono\" style=\"font-size:9px;color:var(--text-on-accent);background:var(--accent);border-radius:999px;padding:0 5px\">②<\u002Fspan>\n              <span style=\"display:inline-flex;cursor:pointer\">{{ icX }}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10px\">43  }<\u002Fdiv>\n            <div style=\"position:absolute;left:8px;bottom:22px;font-size:9.5px;color:var(--text-tertiary)\"><span class=\"cal\" style=\"width:15px;height:15px;font-size:9px\">7<\u002Fspan> ①②＝點選順序，決定上下行序<\u002Fdiv>\n            <div style=\"position:absolute;left:8px;bottom:7px;font-size:9.5px;color:var(--text-tertiary);display:flex;align-items:center;gap:4px\"><span class=\"cal\" style=\"width:15px;height:15px;font-size:9px\">8<\u002Fspan>{{ icX }} 或拖出中欄＝discard 這段<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split-v\" style=\"position:relative\"><span class=\"cal cal-o\" style=\"left:-7px;top:12px\">9<\u002Fspan><\u002Fdiv>\n\n        <div class=\"mkpane\" style=\"flex:1;display:flex;flex-direction:column;min-width:0\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">10<\u002Fspan>RIGHT — theirs (feature/graph-lanes)<\u002Fdiv>\n          <div style=\"flex:1;overflow:hidden;position:relative\">\n            <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10px\">40  for (final lane in lanes) {<\u002Fdiv>\n            <div style=\"position:relative;background:var(--diff-add-bg)\">\n              <div class=\"gbm-diffline\" style=\"font-size:10px;color:var(--diff-add-text)\">41    if (lane.free &amp;&amp; lane.seed != c) {<\u002Fdiv>\n              <div class=\"gbm-diffline\" style=\"font-size:10px;color:var(--diff-add-text)\">42      return lane.index;<\u002Fdiv>\n              <div style=\"position:absolute;left:5px;top:4px;display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:var(--radius-sm);background:var(--accent);box-shadow:var(--shadow-md)\">{{ icArrowL }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10px\">43  }<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;padding:8px 11px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);min-width:1080px;box-sizing:border-box\">\n        <span class=\"cal\">11<\u002Fspan>\n        <span style=\"font-size:10.5px;color:var(--text-tertiary);flex:1\">LaneAllocator.dart — 衝突 2 段，已解 1 段<\u002Fspan>\n        <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Previous<\u002Fbutton>\n        <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Next conflict<\u002Fbutton>\n        <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Mark resolved<\u002Fbutton>\n        <button class=\"gbm-btn gbm-btn-danger gbm-btn-sm\">Abort<\u002Fbutton>\n        <button class=\"gbm-btn gbm-btn-primary gbm-btn-sm\">Continue rebase<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:34px 1.2fr .85fr 2.3fr\" class=\"tbl\">\n      <div class=\"th\"><\u002Fdiv><div class=\"th\">區塊 / 操作<\u002Fdiv><div class=\"th\">Shortcut<\u002Fdiv><div class=\"th\">行為<\u002Fdiv>\n      <sc-for list=\"{{ p8rows }}\" as=\"r\" hint-placeholder-count=\"11\">\n        <div class=\"td\" style=\"text-align:center\"><span class=\"cal\">{{ r.n }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\" style=\"color:var(--text-primary)\">{{ r.el }}<\u002Fdiv>\n        <div class=\"td\"><span class=\"kbd\">{{ r.key }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\">{{ r.note }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">點行套用的順序規則（第 8 題核心）<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        整段套用用 hover 出現的 <strong style=\"color:var(--text-primary)\">→ / ←<\u002Fstrong> 鈕，或把整段拖進中欄。<br>\n        單行套用則是<strong style=\"color:var(--text-primary)\">直接點該行<\u002Fstrong>：第一次點的行進到結果的<strong style=\"color:var(--text-primary)\">上面<\u002Fstrong>，第二次點的行接在<strong style=\"color:var(--text-primary)\">下面<\u002Fstrong>，依此類推，中欄以 ①②③ 標示順序。<br>\n        所以「左 → 右」與「右 → 左」點擊順序不同，產生的結果檔行序也不同——這是刻意的，取代傳統 both-sides 按鈕的兩個固定選項。<br>\n        套用後的行可在中欄按行尾的<strong style=\"color:var(--text-primary)\">刪除鈕<\u002Fstrong>或拖出中欄 discard，序號會自動重排。整段 discard 用 <span class=\"kbd\">Ctrl/⌘+Z<\u002Fspan> 復原。\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:8px\">解完之後的 commit message — 自動帶入預設值<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9;margin-bottom:12px\">\n        全部檔案標記 resolved 後按 <strong style=\"color:var(--text-primary)\">Continue<\u002Fstrong>，不直接送出，先開一個 commit message 步驟，訊息<strong style=\"color:var(--text-primary)\">依作業種類預先填好<\u002Fstrong>，游標停在訊息結尾、全文可改。使用者若清空 summary，按鈕會停用而不是偷偷用預設值送出。\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.85fr 1.15fr 1.6fr\" class=\"tbl\">\n        <div class=\"th\">作業<\u002Fdiv><div class=\"th\">預設 summary<\u002Fdiv><div class=\"th\">預設 description<\u002Fdiv>\n        <sc-for list=\"{{ msgRows }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ m.op }}<\u002Fdiv>\n          <div class=\"td gbm-mono\" style=\"font-size:11px\">{{ m.sum }}<\u002Fdiv>\n          <div class=\"td\">{{ m.desc }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9;margin-top:12px\">\n        來源是 git 自己寫下的 <span class=\"gbm-mono\">MERGE_MSG<\u002Fspan> / <span class=\"gbm-mono\">rebase-merge/message<\u002Fspan>，不是自行拼字串，所以與 CLI 的結果一致。<br>\n        衝突檔清單以 <span class=\"gbm-mono\">#<\u002Fspan> 註解行附在 description 末端，提交時會被 git 自動去掉；面板上這幾行以 tertiary 灰顯示，並註明「送出時會移除」。<br>\n        Rebase 與 cherry-pick 沿用原始 commit 的完整訊息（含 author date），只有 merge 與 revert 會產生新訊息。若使用者改過訊息後又按 Abort，草稿保留到下次同一個作業。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P9 splitters ══ -->\n  <sc-if value=\"{{ isP9 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n      <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n        <div style=\"font-size:12.5px;font-weight:600;margin-bottom:8px\">分割線互動規格<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n          視覺寬度 <strong style=\"color:var(--text-primary)\">1px<\u002Fstrong>（<span class=\"gbm-mono\">--border-subtle<\u002Fspan>），實際命中區 <strong style=\"color:var(--text-primary)\">5px<\u002Fstrong>，往兩側各外擴 2px。<br>\n          Hover 120ms 後整條轉 <span class=\"gbm-mono\">--accent<\u002Fspan>，游標變 <span class=\"gbm-mono\">resizeColumn<\u002Fspan> / <span class=\"gbm-mono\">resizeRow<\u002Fspan>。<br>\n          拖曳即時重排，不用半透明預覽線。<br>\n          <strong style=\"color:var(--text-primary)\">雙擊＝回預設寬度<\u002Fstrong>；拖到小於 min 會吸附停住，不會把面板拖不見。<br>\n          鍵盤：Tab 可聚焦，方向鍵每次 16px，<span class=\"kbd\">Shift<\u002Fspan> 加大到 64px。\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n        <div style=\"font-size:12.5px;font-weight:600;margin-bottom:8px\">Flutter 實作<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n          自訂 <span class=\"gbm-mono\">SplitPane<\u002Fspan>：<span class=\"gbm-mono\">Row<\u002Fspan> / <span class=\"gbm-mono\">Column<\u002Fspan> + 每格 <span class=\"gbm-mono\">Flexible<\u002Fspan>，分割線是 <span class=\"gbm-mono\">MouseRegion<\u002Fspan>（改游標）包 <span class=\"gbm-mono\">GestureDetector<\u002Fspan>（<span class=\"gbm-mono\">onHorizontalDragUpdate<\u002Fspan>）。<br>\n          比例存成 <span class=\"gbm-mono\">List&lt;double&gt;<\u002Fspan> flex 權重，不是絕對像素，視窗縮放時面板等比例變化。<br>\n          每條分割線一個穩定 id，經 <span class=\"gbm-mono\">shared_preferences<\u002Fspan> 存檔，主視窗與 conflict 視窗分開記憶。\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.75fr 1.1fr .95fr .6fr .6fr .95fr\" class=\"tbl\">\n      <div class=\"th\">ID<\u002Fdiv><div class=\"th\">位置<\u002Fdiv><div class=\"th\">方向<\u002Fdiv><div class=\"th\">預設<\u002Fdiv><div class=\"th\">最小<\u002Fdiv><div class=\"th\">備註<\u002Fdiv>\n      <sc-for list=\"{{ splitters }}\" as=\"s\" hint-placeholder-count=\"8\">\n        <div class=\"td gbm-mono\" style=\"color:var(--accent);font-size:11px\">{{ s.id }}<\u002Fdiv>\n        <div class=\"td\" style=\"color:var(--text-primary)\">{{ s.where }}<\u002Fdiv>\n        <div class=\"td\">{{ s.dir }}<\u002Fdiv>\n        <div class=\"td gbm-mono\">{{ s.def }}<\u002Fdiv>\n        <div class=\"td gbm-mono\">{{ s.min }}<\u002Fdiv>\n        <div class=\"td\">{{ s.note }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P10 log ══ -->\n  <sc-if value=\"{{ isP10 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"mock\">\n      <div class=\"mkbar\" style=\"height:34px;gap:6px\"><span>File<\u002Fspan><span>Edit<\u002Fspan><span>View<\u002Fspan><span>Repository<\u002Fspan><span>Help<\u002Fspan><\u002Fdiv>\n      <div style=\"height:96px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-tertiary)\">History / Working Copy — 背景作業進行中不會遮住主要內容<\u002Fdiv>\n\n      <div style=\"border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);display:flex;flex-direction:column\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border-subtle)\">\n          <span class=\"cal\">4<\u002Fspan>\n          <span style=\"display:inline-flex\">{{ icTerminal }}<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:600;flex:1\">Log<\u002Fspan>\n          <span style=\"font-size:10px;color:var(--text-tertiary)\">info · warning · error<\u002Fspan>\n          <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Copy all<\u002Fbutton>\n          <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Save as…<\u002Fbutton>\n          <span style=\"display:inline-flex\">{{ icChevUp }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:5px 0;font-family:var(--font-mono);font-size:10px;line-height:1.85\">\n          <div style=\"display:flex;gap:8px;padding:1px 11px\"><span style=\"color:var(--text-tertiary);flex-shrink:0\">14:22:09<\u002Fspan><span style=\"display:inline-flex;flex-shrink:0\">{{ icOk }}<\u002Fspan><span style=\"color:var(--text-secondary);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">git fetch --prune origin — exit 0 · 1.42 s · 3 refs updated<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;padding:1px 11px\"><span style=\"color:var(--text-tertiary);flex-shrink:0\">14:22:10<\u002Fspan><span style=\"display:inline-flex;flex-shrink:0\">{{ icWarn }}<\u002Fspan><span style=\"color:var(--warning);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">origin/graph-lanes 已不存在於遠端，標記為 gone（尚未 prune）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;padding:1px 11px;background:var(--diff-del-bg)\"><span style=\"color:var(--text-tertiary);flex-shrink:0\">14:22:41<\u002Fspan><span style=\"display:inline-flex;flex-shrink:0\">{{ icErr }}<\u002Fspan><span style=\"color:var(--diff-del-text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">git push origin main — exit 1 · rejected: non-fast-forward<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;padding:1px 11px\"><span style=\"color:var(--text-tertiary);flex-shrink:0\">14:23:02<\u002Fspan><span style=\"display:inline-flex;flex-shrink:0\">{{ icLoader }}<\u002Fspan><span style=\"color:var(--text-secondary);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">git clone https://…/design-tokens — receiving objects 12,480 / 31,206<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:9px;height:26px;padding:0 10px;border-top:1px solid var(--border-subtle);background:var(--surface-panel);font-size:10.5px;color:var(--text-tertiary)\">\n        <span class=\"cal\">1<\u002Fspan><span>main ↑2 ↓0<\u002Fspan>\n        <span style=\"width:1px;height:12px;background:var(--border-subtle)\"><\u002Fspan>\n        <span class=\"cal\">2<\u002Fspan>\n        <span style=\"display:inline-flex\">{{ icLoader }}<\u002Fspan>\n        <span>Cloning design-tokens — 12,480 / 31,206<\u002Fspan>\n        <span style=\"width:74px;height:4px;border-radius:999px;background:var(--surface-sunken);overflow:hidden\"><span style=\"display:block;width:40%;height:100%;background:var(--accent)\"><\u002Fspan><\u002Fspan>\n        <span style=\"color:var(--text-link);cursor:pointer\">Cancel<\u002Fspan>\n        <span style=\"width:1px;height:12px;background:var(--border-subtle)\"><\u002Fspan>\n        <span style=\"color:var(--text-tertiary)\">+1 task<\u002Fspan>\n        <span style=\"flex:1\"><\u002Fspan>\n        <span class=\"cal\">3<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;color:var(--danger);cursor:pointer\">{{ icErr }}Push rejected<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:4px;cursor:pointer\">{{ icTerminal }}Log<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:34px 1.15fr .85fr 2.3fr\" class=\"tbl\">\n      <div class=\"th\"><\u002Fdiv><div class=\"th\">元件<\u002Fdiv><div class=\"th\">Shortcut<\u002Fdiv><div class=\"th\">行為<\u002Fdiv>\n      <sc-for list=\"{{ p10rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n        <div class=\"td\" style=\"text-align:center\"><span class=\"cal\">{{ r.n }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\" style=\"color:var(--text-primary)\">{{ r.el }}<\u002Fdiv>\n        <div class=\"td\"><span class=\"kbd\">{{ r.key }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\">{{ r.note }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">背景作業一覽<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1.05fr .6fr 2.1fr\" class=\"tbl\">\n        <div class=\"th\">作業<\u002Fdiv><div class=\"th\">顯示位置<\u002Fdiv><div class=\"th\">取消<\u002Fdiv><div class=\"th\">說明<\u002Fdiv>\n        <sc-for list=\"{{ tasks }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ t.task }}<\u002Fdiv>\n          <div class=\"td\">{{ t.where }}<\u002Fdiv>\n          <div class=\"td\">{{ t.cancel }}<\u002Fdiv>\n          <div class=\"td\">{{ t.note }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">Log 規則<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.62fr 2.6fr\" class=\"tbl\">\n        <div class=\"th\">面向<\u002Fdiv><div class=\"th\">規則<\u002Fdiv>\n        <sc-for list=\"{{ logRules }}\" as=\"l\" hint-placeholder-count=\"6\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ l.k }}<\u002Fdiv>\n          <div class=\"td\">{{ l.v }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"display:flex;align-items:baseline;gap:7px\"><span class=\"cal\">5<\u002Fspan><span style=\"font-size:12px;font-weight:600\">錯誤訊息視窗<\u002Fspan><\u002Fdiv>\n        <div class=\"gbm-panel-raised\" style=\"border:1px solid var(--border-default);overflow:hidden\">\n          <div style=\"display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px\">\n            <span style=\"display:inline-flex;margin-top:1px\">{{ icErrBig }}<\u002Fspan>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-size:13px;font-weight:600;margin-bottom:4px\">無法推送到 origin/main<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--text-secondary);line-height:1.75\">遠端比本機多 3 個 commit。直接推送會覆蓋別人的紀錄，因此 git 拒絕了這次操作。<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 16px 12px\">\n            <div style=\"display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-tertiary);margin-bottom:5px;cursor:pointer\">{{ icChevDown }}git 的原始輸出<\u002Fdiv>\n            <div class=\"gbm-mono\" style=\"font-size:10px;line-height:1.75;background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text-secondary);white-space:pre-wrap\">$ git push origin main\n ! [rejected]  main -&gt; main (non-fast-forward)\nerror: failed to push some refs to 'origin'\nexit 1 · 0.84 s<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:11px 16px;border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:7px\">\n            <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Copy details<\u002Fbutton>\n            <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Open log<\u002Fbutton>\n            <span style=\"flex:1\"><\u002Fspan>\n            <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Close<\u002Fbutton>\n            <button class=\"gbm-btn gbm-btn-primary gbm-btn-sm\">Pull then push<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:10.5px;color:var(--text-tertiary);line-height:1.7\">主要按鈕永遠是<strong style=\"color:var(--text-secondary)\">下一步的動作<\u002Fstrong>，不是 OK。<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n          <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">什麼時候才開視窗<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n            預設<strong style=\"color:var(--text-primary)\">不開<\u002Fstrong>。錯誤先進 log，並在 status bar 留一則常駐可點的摘要（10-3）。只有兩種情況升級成視窗：<strong style=\"color:var(--text-primary)\">使用者剛剛主動按下的動作失敗了<\u002Fstrong>，或<strong style=\"color:var(--text-primary)\">需
