要使用者做決定才能繼續<\u002Fstrong>。<br>\n            背景作業（自動 fetch、掃描、LFS 抓取）失敗一律不彈窗——沒有人按過按鈕，就不該打斷。\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr .62fr 1.35fr\" class=\"tbl\">\n          <div class=\"th\">錯誤<\u002Fdiv><div class=\"th\">呈現<\u002Fdiv><div class=\"th\">主要按鈕<\u002Fdiv>\n          <sc-for list=\"{{ errCases }}\" as=\"e\" hint-placeholder-count=\"6\">\n            <div class=\"td\" style=\"color:var(--text-primary)\">{{ e.err }}<\u002Fdiv>\n            <div class=\"td\">{{ e.mode }}<\u002Fdiv>\n            <div class=\"td\">{{ e.action }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">錯誤訊息的寫法<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        標題寫<strong style=\"color:var(--text-primary)\">哪個動作失敗了<\u002Fstrong>，用產品的話；內文寫<strong style=\"color:var(--text-primary)\">為什麼<\u002Fstrong>，一到兩句，講具體條件與實際數字（多 3 個 commit），不寫「發生未知錯誤」。<br>\n        git 的原始輸出<strong style=\"color:var(--text-primary)\">一定保留<\u002Fstrong>，摺疊在下方、等寬字、可選取複製。翻譯過的說明不取代原文，因為排查時需要真正的那行字。<br>\n        Copy details 複製的是標題、原始輸出、指令、exit code 與時間戳，貼進 issue 就夠用。<br>\n        同一個錯誤連續發生不重複開窗，改為在既有視窗上累加次數。視窗不阻擋其他 repo 的操作。\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">取消的語意<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        <strong style=\"color:var(--text-primary)\">取消永遠不刪已經存在的東西。<\u002Fstrong>Fetch 取消保留已抓到的 objects，下次續傳；History 掃描取消保留已載入的部分並在頂端註明「已載入 40,000 / 199,960，捲到底可續掃」。<br>\n        唯一會刪東西的是 clone 取消——因為目標資料夾是這次動作建立的——log 會寫明刪除的路徑。<br>\n        會改寫 working tree 的作業（checkout / merge / rebase）不提供取消，取消鈕直接停用並附原因，不做成按了沒反應。<br>\n        所有截斷與上限一律顯示實際數字，不做無聲截斷。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P11 preferences ══ -->\n  <sc-if value=\"{{ isP11 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel-raised\" style=\"border:1px solid var(--border-default);overflow:hidden;max-width:880px\">\n      <div style=\"padding:12px 16px;border-bottom:1px solid var(--border-subtle);font-size:13px;font-weight:600\">Preferences<\u002Fdiv>\n      <div style=\"display:flex;min-height:376px\">\n        <div style=\"width:168px;border-right:1px solid var(--border-subtle);background:var(--surface-sunken);padding:8px 6px;display:flex;flex-direction:column;gap:1px\">\n          <span class=\"cal\" style=\"margin:2px 0 5px 6px\">1<\u002Fspan>\n          <sc-for list=\"{{ prefNav }}\" as=\"n\" hint-placeholder-count=\"6\">\n            <div class=\"gbm-row {{ n.cls }}\" style=\"height:27px;font-size:11.5px\">{{ n.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0;padding:16px 18px;display:flex;flex-direction:column;gap:16px\">\n\n          <div>\n            <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:7px\">\n              <span class=\"cal\">2<\u002Fspan>\n              <span style=\"font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary)\">Base folders — 自動掃描的根目錄<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"gbm-panel\" style=\"overflow:hidden\">\n              <div style=\"display:grid;grid-template-columns:1fr 74px 96px 30px;font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;background:var(--surface-sunken);border-bottom:1px solid var(--border-subtle)\">\n                <span>路徑<\u002Fspan><span>深度<\u002Fspan><span>目前找到<\u002Fspan><span><\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ baseFolders }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <div style=\"display:grid;grid-template-columns:1fr 74px 96px 30px;align-items:center;font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--border-subtle)\">\n                  <span class=\"gbm-mono\" style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ f.path }}<\u002Fspan>\n                  <span class=\"gbm-mono\" style=\"color:var(--text-secondary)\">{{ f.depth }}<\u002Fspan>\n                  <span style=\"color:var(--text-secondary);font-size:10.5px\">{{ f.found }}<\u002Fspan>\n                  <span style=\"display:inline-flex;justify-content:flex-end;cursor:pointer\">{{ icTrash }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;align-items:center;gap:7px;padding:8px 10px\">\n                <span class=\"cal\">3<\u002Fspan>\n                <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">{{ icFolderPlus }}Add folder…<\u002Fbutton>\n                <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Rescan now<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span class=\"cal\">4<\u002Fspan>\n              <span class=\"gbm-checkbox checked\" style=\"width:14px;height:14px\"><\u002Fspan>\n              <span style=\"font-size:12px\">背景自動掃描，每<\u002Fspan>\n              <span class=\"gbm-mono\" style=\"font-size:11px;border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:2px 7px\">30<\u002Fspan>\n              <span style=\"font-size:12px\">分鐘一次<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;padding-left:27px\">\n              <span class=\"gbm-checkbox checked\" style=\"width:14px;height:14px\"><\u002Fspan>\n              <span style=\"font-size:12px\">略過 node_modules、.git、隱藏資料夾<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-start;gap:9px;padding-left:2px\">\n              <span class=\"cal\">5<\u002Fspan>\n              <span style=\"display:inline-flex;margin-top:1px\">{{ icFolderSearch }}<\u002Fspan>\n              <span style=\"font-size:11.5px;color:var(--text-secondary);line-height:1.7\">找到 <strong style=\"color:var(--text-primary)\">23<\u002Fstrong> 個 repository，跨 3 個資料夾 · 上次掃描 4 分鐘前 · 412 ms<br><span style=\"color:var(--text-tertiary)\">有 2 個資料夾因超過深度上限未展開，調整深度可納入<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid var(--border-subtle);padding-top:15px;display:flex;flex-direction:column;gap:9px\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span class=\"cal\">6<\u002Fspan>\n              <span class=\"gbm-checkbox checked\" style=\"width:14px;height:14px\"><\u002Fspan>\n              <span style=\"font-size:12px\">記錄我手動 Open repository 的位置<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;padding-left:2px\">\n              <span class=\"cal\">7<\u002Fspan>\n              <span style=\"flex:1;font-size:11.5px;color:var(--text-secondary);min-width:0\">已記錄 <strong style=\"color:var(--text-primary)\">6<\u002Fstrong> 個位置 · 最近 <span class=\"gbm-mono\">~/tmp/spike-lfs<\u002Fspan><\u002Fspan>\n              <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Show all<\u002Fbutton>\n              <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Clear list<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:10.5px;color:var(--text-tertiary);padding-left:2px\">清除只移除清單紀錄，磁碟上的 repository 不受影響。<\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:11px 16px;border-top:1px solid var(--border-subtle);display:flex;justify-content:flex-end;gap:7px\">\n        <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Cancel<\u002Fbutton><button class=\"gbm-btn gbm-btn-primary gbm-btn-sm\">Save<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:34px 1.15fr .8fr 2.4fr\" class=\"tbl\">\n      <div class=\"th\"><\u002Fdiv><div class=\"th\">元件<\u002Fdiv><div class=\"th\">Shortcut<\u002Fdiv><div class=\"th\">說明<\u002Fdiv>\n      <sc-for list=\"{{ p11rows }}\" as=\"r\" hint-placeholder-count=\"9\">\n        <div class=\"td\" style=\"text-align:center\"><span class=\"cal\">{{ r.n }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\" style=\"color:var(--text-primary)\">{{ r.el }}<\u002Fdiv>\n        <div class=\"td\"><span class=\"kbd\">{{ r.key }}<\u002Fspan><\u002Fdiv>\n        <div class=\"td\">{{ r.note }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start\">\n      <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n        <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:9px\">\n          <span class=\"cal\">8<\u002Fspan><span style=\"font-size:12.5px;font-weight:600\">全域 gitignore（Git 段）<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:11px\">\n          <div style=\"display:flex;align-items:center;gap:9px\">\n            <span style=\"width:14px;height:14px;flex-shrink:0;border-radius:3px;border:1.5px solid var(--accent);background:var(--accent)\"><\u002Fspan>\n            <span style=\"font-size:12px\">啟用全域 gitignore<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px\">\n            <span class=\"gbm-mono\" style=\"flex:1;min-width:0;font-size:10.5px;height:27px;display:flex;align-items:center;padding:0 8px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-panel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">~/.config/git/ignore<\u002Fspan>\n            <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Browse…<\u002Fbutton>\n            <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Edit<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"gbm-mono\" style=\"font-size:10px;line-height:1.75;background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text-secondary);white-space:pre-wrap\">.DS_Store\nThumbs.db\n.idea/\n*.swp<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--text-secondary);line-height:1.85\">\n          寫入 <span class=\"gbm-mono\">core.excludesFile<\u002Fspan>，與 CLI 共用同一份，不是本 app 私有的忽略清單。<br>\n          Edit 用內建的純文字編輯器開啟，存檔即生效並立刻重算 working copy；不需要重開 repo。<br>\n          若該路徑已被使用者的 <span class=\"gbm-mono\">.gitconfig<\u002Fspan> 設過，欄位帶入現值並標註「由既有 git 設定帶入」，不覆寫。<br>\n          停用只移除 <span class=\"gbm-mono\">core.excludesFile<\u002Fspan> 設定，<strong style=\"color:var(--text-primary)\">不刪除檔案<\u002Fstrong>——這句寫在核取方塊旁。\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n        <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:9px\">\n          <span class=\"cal\">9<\u002Fspan><span style=\"font-size:12.5px;font-weight:600\">自動 fetch（General 段）<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:11px\">\n          <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n            <span style=\"width:14px;height:14px;flex-shrink:0;border-radius:3px;border:1.5px solid var(--accent);background:var(--accent)\"><\u002Fspan>\n            <span style=\"font-size:12px\">自動 fetch 目前開啟的 repository，每<\u002Fspan>\n            <span class=\"gbm-mono\" style=\"font-size:11px;border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:2px 7px\">10<\u002Fspan>\n            <span style=\"font-size:12px\">分鐘<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px;padding-left:23px\">\n            <span style=\"width:14px;height:14px;flex-shrink:0;border-radius:3px;border:1.5px solid var(--border-strong);background:var(--surface-panel)\"><\u002Fspan>\n            <span style=\"font-size:12px\">同時 prune 已刪除的遠端分支<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px;padding-left:23px\">\n            <span style=\"width:14px;height:14px;flex-shrink:0;border-radius:3px;border:1.5px solid var(--accent);background:var(--accent)\"><\u002Fspan>\n            <span style=\"font-size:12px\">使用計量付費網路時暫停<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:var(--text-secondary);line-height:1.85\">\n          <strong style=\"color:var(--text-primary)\">只抓目前開啟的那一個 repo<\u002Fstrong>，不是清單裡全部——23 個 repo 每 10 分鐘各 fetch 一次是不必要的網路與磁碟負擔。切換 repo 時計時器重置。<br>\n          純 <span class=\"gbm-mono\">fetch<\u002Fspan>，永遠不 pull、不改動 working tree，所以任何時候執行都安全。<br>\n          屬於背景低優先度作業：只在 status bar 的 +N task 內顯示，失敗不彈窗（見 <a href=\"#\" sc-camel-on-click=\"{{ goP10 }}\">10<\u002Fa>）。有前景作業或處於 conflict 狀態時自動跳過該次。<br>\n          結果反映在 sidebar 的 ahead/behind 數字與 gone 標記上；有新變化時 status bar 的分支區短暫高亮一次，不跳通知。\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:8px\">Open in terminal — 外部工具設定（General 段）<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.55fr .95fr 1.9fr\" class=\"tbl\">\n        <div class=\"th\">平台<\u002Fdiv><div class=\"th\">預設終端機<\u002Fdiv><div class=\"th\">實際執行<\u002Fdiv>\n        <sc-for list=\"{{ terminals }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ t.os }}<\u002Fdiv>\n          <div class=\"td\">{{ t.app }}<\u002Fdiv>\n          <div class=\"td gbm-mono\" style=\"font-size:10.5px\">{{ t.cmd }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9;margin-top:12px\">\n        下拉可改成偵測到的其他終端機（iTerm2、Windows Terminal、Alacritty、Kitty…），或選 <strong style=\"color:var(--text-primary)\">Custom command<\u002Fstrong> 自填，用 <span class=\"gbm-mono\">{path}<\u002Fspan> 代入工作目錄。存檔前有 Test 按鈕實際開一次。<br>\n        <strong style=\"color:var(--text-primary)\">工作目錄依呼叫位置不同<\u002Fstrong>：從 repository 相關入口開啟＝repo 根目錄；從檔案列的 05-F / 05-K 開啟＝<strong style=\"color:var(--text-primary)\">該檔案所在資料夾<\u002Fstrong>，省去進去後再 cd。<br>\n        入口共四處：<span class=\"gbm-mono\">Repository → Open in terminal<\u002Fspan>（<span class=\"kbd\">Ctrl/Cmd+`<\u002Fspan>）、repo 切換彈窗的 05-A、檔案右鍵 05-F / 05-K、以及 status bar 分支區的右鍵。<br>\n        找不到指定的終端機時不靜默失敗：status bar 顯示錯誤、log 寫下嘗試執行的完整指令與結束代碼，並附一個直接跳到該設定的連結。\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">兩種來源，一份清單<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        Repository 切換彈窗（<a href=\"#\" sc-camel-on-click=\"{{ goP2 }}\">02-15<\u002Fa>）顯示的是<strong style=\"color:var(--text-primary)\">兩種來源合併後<\u002Fstrong>的結果：base folders 掃到的，加上手動開啟過的。列上會標示來源，手動加入的可單獨移除，掃描來的則要改 base folder 設定才會消失——避免使用者刪了卻在下次掃描又冒出來。<br>\n        兩份清單都只存路徑，不快取 repo 內容；路徑失效時該列標為離線並保留，不自動清掉。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P12 compare ══ -->\n  <sc-if value=\"{{ isP12 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">看變更：四種對象各在哪裡<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.62fr 1.35fr 2.1fr\" class=\"tbl\">\n        <div class=\"th\">對象<\u002Fdiv><div class=\"th\">位置<\u002Fdiv><div class=\"th\">操作<\u002Fdiv>\n        <sc-for list=\"{{ changeViews }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ c.obj }}<\u002Fdiv>\n          <div class=\"td\">{{ c.where }}<\u002Fdiv>\n          <div class=\"td\">{{ c.how }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mock\">\n      <div class=\"mkbar\" style=\"height:34px;gap:7px\">\n        <span class=\"cal\">1<\u002Fspan>\n        <span style=\"display:inline-flex\">{{ icCompare }}<\u002Fspan>\n        <span style=\"font-size:11.5px;font-weight:600\">Compare<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border:1px solid var(--border-default);border-radius:var(--radius-md)\">{{ icTag }}v0.5.0{{ icChevDown }}<\u002Fspan>\n        <span style=\"font-size:10.5px;color:var(--text-tertiary)\">→<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border:1px solid var(--border-default);border-radius:var(--radius-md)\">{{ icBranch }}main{{ icChevDown }}<\u002Fspan>\n        <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Swap<\u002Fbutton>\n        <span style=\"flex:1\"><\u002Fspan>\n        <span class=\"cal\">2<\u002Fspan>\n        <span style=\"font-size:10.5px;color:var(--text-tertiary)\">two-dot<\u002Fspan>\n        <span style=\"font-size:10.5px;color:var(--text-tertiary)\">·<\u002Fspan>\n        <span style=\"font-size:10.5px;color:var(--accent)\">three-dot<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;height:260px\">\n        <div class=\"mkpane\" style=\"width:236px;display:flex;flex-direction:column\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">3<\u002Fspan>Commits · 18<\u002Fdiv>\n          <div style=\"padding:5px;display:flex;flex-direction:column;gap:1px\">\n            <div class=\"gbm-row\" style=\"height:25px;font-size:10.5px;gap:7px\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--graph-lane-1)\"><\u002Fspan><span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Fix lane allocator overflow<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">a1b2c3d<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:25px;font-size:10.5px;gap:7px\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--graph-lane-1)\"><\u002Fspan><span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Add askpass helper<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">4b8f01c<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:25px;font-size:10.5px;gap:7px\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--graph-lane-3)\"><\u002Fspan><span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Side-by-side conflict view<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">2e6a7bd<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split-v\"><\u002Fdiv>\n        <div class=\"mkpane\" style=\"width:210px;display:flex;flex-direction:column\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">4<\u002Fspan>Files · 12<\u002Fdiv>\n          <div style=\"padding:5px;display:flex;flex-direction:column;gap:1px\">\n            <div class=\"gbm-row selected\" style=\"height:25px;font-size:10.5px\">{{ icFile }}<span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">LaneAllocator.dart<\u002Fspan><span class=\"gbm-badge gbm-badge-added\">+12<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:25px;font-size:10.5px\">{{ icFile }}<span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">graph_builder.dart<\u002Fspan><span class=\"gbm-badge gbm-badge-removed\">−8<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split-v\"><\u002Fdiv>\n        <div class=\"mkpane\" style=\"flex:1;display:flex;flex-direction:column;min-width:0\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">5<\u002Fspan>Diff — 唯讀<\u002Fdiv>\n          <div style=\"padding:2px 0\">\n            <div class=\"gbm-diffline gbm-diffline-hunk\" style=\"font-size:10px\">@@ -40,3 +40,3 @@<\u002Fdiv>\n            <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10px\">40  for (final lane in lanes) {<\u002Fdiv>\n            <div class=\"gbm-diffline gbm-diffline-del\" style=\"font-size:10px\">41 −     if (lane.free) return lane.index;<\u002Fdiv>\n            <div class=\"gbm-diffline gbm-diffline-add\" style=\"font-size:10px\">41 +     if (lane.free &amp;&amp; lane.seed != commit) return lane.index;<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;height:24px;padding:0 10px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);font-size:10.5px;color:var(--text-tertiary)\">\n        <span class=\"cal\">6<\u002Fspan><span>merge base 7c3d9e2 · 18 commits · 12 files · +420 −86<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">可比較的組合與入口<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.8fr 1.35fr 1.95fr\" class=\"tbl\">\n        <div class=\"th\">組合<\u002Fdiv><div class=\"th\">入口<\u002Fdiv><div class=\"th\">結果<\u002Fdiv>\n        <sc-for list=\"{{ compares }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ c.pair }}<\u002Fdiv>\n          <div class=\"td\">{{ c.entry }}<\u002Fdiv>\n          <div class=\"td\">{{ c.out }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">Compare 的共通規則<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        兩個 ref 選擇器都吃<strong style=\"color:var(--text-primary)\">同一種下拉<\u002Fstrong>：branch / tag / commit / stash / working copy 混在一份可搜尋清單，以圖示區分類型。所以四種比較不是四個功能，是同一個畫面的不同輸入。<br>\n        方向固定「左是基準、右是新的」，Swap 一鍵對調。<span class=\"gbm-mono\">two-dot<\u002Fspan> 是兩點直接差異，<span class=\"gbm-mono\">three-dot<\u002Fspan> 是從 merge base 起算，預設 three-dot 並在 status 列寫出 merge base 的 hash。<br>\n        Compare 以<strong style=\"color:var(--text-primary)\">分頁<\u002Fstrong>形式開在中央區，與 History / Working Copy 並列，可同時存在多個並各自記憶捲動位置；<span class=\"kbd\">Ctrl/Cmd+W<\u002Fspan> 關閉當前 compare 分頁。<br>\n        結果一律唯讀，唯一例外是與 working copy 比較時可逐檔 checkout 覆蓋，且動作前一定有確認 dialog。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;gap:9px;padding-top:6px\">\n    <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\" sc-camel-on-click=\"{{ prevPage }}\">← 上一頁<\u002Fbutton>\n    <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\" sc-camel-on-click=\"{{ nextPage }}\">下一頁 →<\u002Fbutton>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900}}\">\nconst PAGES = [\n  { id: 'p1', num: '01', label: '平台與視窗架構' , title: '平台與視窗架構', intent: '三平台統一樣式，只有 menu bar 位置與標題列跟隨系統' },\n  { id: 'p2', num: '02', label: '主視窗 — History', title: '主視窗 — History', intent: 'commit description 的主要閱讀位置' },\n  { id: 'p3', num: '03', label: '主視窗 — Working Copy', title: '主視窗 — Working Copy', intent: '暫存、逐行 stage、撰寫 commit description' },\n  { id: 'p4', num: '04', label: 'Menu bar 與快捷鍵', title: 'Menu bar 與快捷鍵全表', intent: '每個動作的選單路徑與 shortcut' },\n  { id: 'p5', num: '05', label: 'Context menu 各層級', title: 'Context menu — 9 種目標、兩層', intent: '右鍵選單的層級與內容' },\n  { id: 'p6', num: '06', label: 'Dialogs', title: 'Dialogs', intent: 'Repository settings 由中央面板改為 dialog' },\n  { id: 'p7', num: '07', label: 'Clean 與 Conflict', title: 'Clean 與 Conflict 狀態', intent: '兩種狀態下 UI 與可用操作的差異' },\n  { id: 'p8', num: '08', label: 'Conflict 解決視窗', title: 'Conflict 解決視窗（獨立 window）', intent: '檔案清單 + 左 / 結果 / 右 三欄，拖曳與點行套用' },\n  { id: 'p9', num: '09', label: '分割線與縮放', title: '分割線與面板縮放', intent: '每條 splitter 的預設、下限與記憶行為' },\n  { id: 'p10', num: '10', label: 'Log 與背景狀態', title: 'Log 與背景狀態', intent: '長時間作業的進度、取消、錯誤與可稽核的指令紀錄' },\n  { id: 'p11', num: '11', label: 'Preferences', title: 'Preferences', intent: 'repository 來源資料夾、自動掃描與手動開啟紀錄' },\n  { id: 'p12', num: '12', label: '看變更與比較', title: '看變更與比較', intent: 'commit / stash 的變更檢視，以及四種 ref 的 compare' },\n];\n\nconst BRANCH_TREE = [\n  { name: 'main', icon: 'git-branch', state: 'synced', badge: '↑2', depth: 0, current: true },\n  { name: 'feature', folder: true, open: true, depth: 0, badge: '3' },\n  { name: 'graph-lanes', icon: 'cloud-off', state: 'gone', badge: 'gone', depth: 1 },\n  { name: 'lfs-prune', icon: 'git-branch', state: 'local', badge: 'local', depth: 1 },\n  { name: 'worktrees', icon: 'cloud', state: 'remote', badge: '', depth: 1, dim: true },\n  { name: 'bugfix', folder: true, open: true, depth: 0, badge: '2' },\n  { name: 'rebase-conflict', icon: 'git-branch', state: 'synced', badge: '↓1', depth: 1 },\n  { name: 'lane-overflow', icon: 'cloud', state: 'remote', badge: '', depth: 1, dim: true },\n  { name: 'release', folder: true, open: false, depth: 0, badge: '4' },\n];\n\nconst BRANCH_STATES = [\n  { st: 'Local 與 remote 同步', icon: 'git-branch', badge: '無', note: '最常見的狀態。實心分支圖示，名稱一般色。' },\n  { st: 'Local 領先 / 落後', icon: 'git-branch', badge: '↑2 / ↓1', note: '同一個圖示，右側加 ahead/behind 數字。同時領先又落後（diverged）顯示 ↑2↓1。' },\n  { st: 'Local only（無 upstream）', icon: 'git-branch', badge: 'local', note: '還沒 push 過。badge 用文字而非圖示，避免與 ahead 混淆。Push 後 badge 自動消失。' },\n  { st: 'Remote only（未 checkout）', icon: 'cloud', badge: '無', note: '雲朵圖示 + 半透明，代表本機還沒有這條分支。點兩下即 checkout 成本機分支，圖示隨即變成實心。' },\n  { st: 'Remote 已刪除', icon: 'cloud-off', badge: 'gone', note: '本機還在、遠端沒了。cloud-off + warning 色 + gone badge。真正移除 remote-tracking ref 要執行 Prune（見下方說明）。' },\n  { st: '目前分支', icon: 'git-branch', badge: '—', note: '名稱加粗、整列以 selected 底色標示，永遠置頂於所屬資料夾內，且不受 filter 影響。' },\n];\n\nconst TERMINALS = [\n  { os: 'Windows', app: 'Windows Terminal', cmd: 'wt.exe -d \"{path}\"（找不到時退回 powershell.exe -NoExit -Command cd \"{path}\"）' },\n  { os: 'macOS', app: 'Terminal.app', cmd: 'open -a Terminal \"{path}\"' },\n  { os: 'Linux', app: '系統預設', cmd: 'x-terminal-emulator --working-directory=\"{path}\"（依序試 gnome-terminal、konsole、xterm）' },\n];\n\nconst PREFNAV = ['General', 'Repository sources', 'Git', 'Appearance', 'Shortcuts', 'Advanced'];\n\nconst BASEFOLDERS = [\n  { path: '~/dev', depth: '2', found: '14 repos' },\n  { path: '~/work/clients', depth: '3', found: '7 repos' },\n  { path: '/Volumes/ext/archive', depth: '1', found: '2 repos · 離線' },\n];\n\nconst P11 = [\n  { n: 1, el: 'Preferences 左側分頁', key: 'Ctrl/Cmd+,', note: '六段：General / Repository sources / Git / Appearance / Shortcuts / Advanced。這裡全部是應用層級設定，單一 repo 的設定在 Repository → Settings…（見 06）。' },\n  { n: 2, el: 'Base folders 清單', key: '—', note: '可加入多個根目錄，每列是路徑 + 掃描深度 + 目前找到幾個 repo。深度獨立設定，因為 ~/dev 這種扁平目錄用 2 層就夠，而 monorepo 集合可能要 3 層。路徑不存在或磁碟未掛載時該列標為離線，保留設定不自動刪除。' },\n  { n: 3, el: 'Add folder…', key: '—', note: '開系統原生資料夾選擇器。加入後立刻掃描一次，結果寫進 log（見 10）。' },\n  { n: 4, el: '自動掃描', key: '—', note: '開啟後依設定的間隔在背景重掃，屬於低優先度作業，只在 status bar 的 +N task 內顯示。關閉時只在按下 Rescan now 才掃。' },\n  { n: 5, el: '掃描結果摘要', key: '—', note: '永遠顯示實際數字：找到幾個 repo、跨幾個資料夾、上次掃描時間與耗時。被深度上限擋掉的資料夾數也一併寫出，不做無聲截斷。' },\n  { n: 6, el: '記錄手動開啟的位置', key: '—', note: '預設開啟。使用者透過 Open repository… 打開的 repo，其所在資料夾會被記進另一份清單，不會混進 base folders。這樣不必為了一個臨時專案去改掃描設定。' },\n  { n: 8, el: '全域 gitignore', key: '—', note: 'Git 段。開關 + 路徑欄 + Browse / Edit，寫入 core.excludesFile，與 CLI 共用。內建純文字編輯器可直接改，存檔即重算 working copy。已由使用者 .gitconfig 設定過時帶入現值並標註來源，不覆寫。停用只移除設定不刪檔。' },\n  { n: 9, el: '自動 fetch', key: '—', note: 'General 段。只針對目前開啟的 repository，預設每 10 分鐘一次，切換 repo 時重置計時。純 fetch 不動 working tree。可選同時 prune、計量網路暫停。背景低優先度，失敗不彈窗；結果反映在 ahead/behind 與 gone 標記。' },\n  { n: 7, el: '手動紀錄清單', key: '—', note: '顯示筆數與最近一筆，可展開逐筆移除或整批清空。清空只影響清單，不會刪除磁碟上的 repo——這點寫在按鈕旁邊。' },\n];\n\nconst CHANGEVIEWS = [\n  { obj: 'Commit', where: 'History 分頁：右側 Changed files（02-10）+ 下方 Commit detail（02-08）', how: '選 commit → 檔案清單即時更新；點檔案在 detail 區顯示該檔 diff；雙擊 commit 開獨立視窗，適合長 body 與逐檔審閱。' },\n  { obj: 'Stash', where: 'Sidebar STASH 段：點一下展開 inline 檔案清單', how: '展開列出該 stash 的檔案與增刪行數；點檔案開 Diff 分頁（唯讀，標題註明 stash@{0}）。右鍵 05-H 的 View diff 等同此動作。stash 不佔用 History 的選取狀態。' },\n  { obj: 'Working copy', where: 'Working Copy 分頁（03）', how: 'unstaged / staged 兩欄 + 下方 diff，可逐行 stage。' },\n  { obj: '兩個 ref 之間', where: 'Compare 分頁', how: '見下方 compare 規格。結果是唯讀的三段式：commits、files、diff。' },\n];\n\nconst COMPARES = [\n  { pair: 'Branch ↔ Branch', entry: '同時選兩個分支 → 右鍵 Compare，或 Repository → Compare…', out: 'commits 分兩欄（只在左 / 只在右），files 為合併後的差異。常用於 merge 前預覽。' },\n  { pair: 'Branch ↔ Tag', entry: '同上，第二個選 tag', out: '通常用來看某版之後改了什麼。標題直接寫 v0.5.0 → main。' },\n  { pair: 'Commit ↔ Commit', entry: 'History 內 Ctrl/Cmd 點選兩個 commit → 右鍵 Compare', out: '兩點之間的完整差異；若非祖先關係，另外標示 merge base 並提供切換「三點 / 兩點」比較。' },\n  { pair: 'Stash ↔ 任意 ref', entry: '右鍵 stash → Compare with…', out: 'stash 一律放在右側（新的一方）。唯讀，不能從這裡 stage。' },\n  { pair: '任意 ref ↔ Working copy', entry: '右鍵該 ref → Compare with working copy', out: '唯一可寫的比較：files 欄的每個檔案可直接 checkout 覆蓋成該 ref 的版本，動作前有確認。' },\n];\n\nconst TASKS = [\n  { task: 'Fetch / Pull / Push', where: 'Status bar 進度區', cancel: '可取消', note: '顯示遠端名與已傳輸物件數（12,480 / 3
