ount=\"3\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ t.os }}<\u002Fdiv>\n          <div class=\"td\">{{ t.app }}<\u002Fdiv>\n          <div class=\"td gbm-mono\" style=\"font-size:10.5px\">{{ t.cmd }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9;margin-top:12px\">\n        下拉可改成偵測到的其他終端機（iTerm2、Windows Terminal、Alacritty、Kitty…），或選 <strong style=\"color:var(--text-primary)\">Custom command<\u002Fstrong> 自填，用 <span class=\"gbm-mono\">{path}<\u002Fspan> 代入工作目錄。存檔前有 Test 按鈕實際開一次。<br>\n        <strong style=\"color:var(--text-primary)\">工作目錄依呼叫位置不同<\u002Fstrong>：從 repository 相關入口開啟＝repo 根目錄；從檔案列的 05-F / 05-K 開啟＝<strong style=\"color:var(--text-primary)\">該檔案所在資料夾<\u002Fstrong>，省去進去後再 cd。<br>\n        入口共四處：<span class=\"gbm-mono\">Repository → Open in terminal<\u002Fspan>（<span class=\"kbd\">Ctrl/Cmd+`<\u002Fspan>）、repo 切換彈窗的 05-A、檔案右鍵 05-F / 05-K、以及 status bar 分支區的右鍵。<br>\n        找不到指定的終端機時不靜默失敗：status bar 顯示錯誤、log 寫下嘗試執行的完整指令與結束代碼，並附一個直接跳到該設定的連結。\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">兩種來源，一份清單<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        Repository 切換彈窗（<a href=\"#\" sc-camel-on-click=\"{{ goP2 }}\">02-15<\u002Fa>）顯示的是<strong style=\"color:var(--text-primary)\">兩種來源合併後<\u002Fstrong>的結果：base folders 掃到的，加上手動開啟過的。列上會標示來源，手動加入的可單獨移除，掃描來的則要改 base folder 設定才會消失——避免使用者刪了卻在下次掃描又冒出來。<br>\n        兩份清單都只存路徑，不快取 repo 內容；路徑失效時該列標為離線並保留，不自動清掉。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P12 compare ══ -->\n  <sc-if value=\"{{ isP12 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">看變更：四種對象各在哪裡<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.62fr 1.35fr 2.1fr\" class=\"tbl\">\n        <div class=\"th\">對象<\u002Fdiv><div class=\"th\">位置<\u002Fdiv><div class=\"th\">操作<\u002Fdiv>\n        <sc-for list=\"{{ changeViews }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ c.obj }}<\u002Fdiv>\n          <div class=\"td\">{{ c.where }}<\u002Fdiv>\n          <div class=\"td\">{{ c.how }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mock\">\n      <div class=\"mkbar\" style=\"height:34px;gap:7px\">\n        <span class=\"cal\">1<\u002Fspan>\n        <span style=\"display:inline-flex\">{{ icCompare }}<\u002Fspan>\n        <span style=\"font-size:11.5px;font-weight:600\">Compare<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border:1px solid var(--border-default);border-radius:var(--radius-md)\">{{ icTag }}v0.5.0{{ icChevDown }}<\u002Fspan>\n        <span style=\"font-size:10.5px;color:var(--text-tertiary)\">→<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border:1px solid var(--border-default);border-radius:var(--radius-md)\">{{ icBranch }}main{{ icChevDown }}<\u002Fspan>\n        <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Swap<\u002Fbutton>\n        <span style=\"flex:1\"><\u002Fspan>\n        <span class=\"cal\">2<\u002Fspan>\n        <span style=\"font-size:10.5px;color:var(--text-tertiary)\">two-dot<\u002Fspan>\n        <span style=\"font-size:10.5px;color:var(--text-tertiary)\">·<\u002Fspan>\n        <span style=\"font-size:10.5px;color:var(--accent)\">three-dot<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;height:260px\">\n        <div class=\"mkpane\" style=\"width:236px;display:flex;flex-direction:column\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">3<\u002Fspan>Commits · 18<\u002Fdiv>\n          <div style=\"padding:5px;display:flex;flex-direction:column;gap:1px\">\n            <div class=\"gbm-row\" style=\"height:25px;font-size:10.5px;gap:7px\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--graph-lane-1)\"><\u002Fspan><span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Fix lane allocator overflow<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">a1b2c3d<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:25px;font-size:10.5px;gap:7px\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--graph-lane-1)\"><\u002Fspan><span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Add askpass helper<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">4b8f01c<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:25px;font-size:10.5px;gap:7px\"><span style=\"width:6px;height:6px;border-radius:999px;background:var(--graph-lane-3)\"><\u002Fspan><span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Side-by-side conflict view<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">2e6a7bd<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split-v\"><\u002Fdiv>\n        <div class=\"mkpane\" style=\"width:210px;display:flex;flex-direction:column\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">4<\u002Fspan>Files · 12<\u002Fdiv>\n          <div style=\"padding:5px;display:flex;flex-direction:column;gap:1px\">\n            <div class=\"gbm-row selected\" style=\"height:25px;font-size:10.5px\">{{ icFile }}<span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">LaneAllocator.dart<\u002Fspan><span class=\"gbm-badge gbm-badge-added\">+12<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:25px;font-size:10.5px\">{{ icFile }}<span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">graph_builder.dart<\u002Fspan><span class=\"gbm-badge gbm-badge-removed\">−8<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split-v\"><\u002Fdiv>\n        <div class=\"mkpane\" style=\"flex:1;display:flex;flex-direction:column;min-width:0\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">5<\u002Fspan>Diff — 唯讀<\u002Fdiv>\n          <div style=\"padding:2px 0\">\n            <div class=\"gbm-diffline gbm-diffline-hunk\" style=\"font-size:10px\">@@ -40,3 +40,3 @@<\u002Fdiv>\n            <div class=\"gbm-diffline gbm-diffline-ctx\" style=\"font-size:10px\">40  for (final lane in lanes) {<\u002Fdiv>\n            <div class=\"gbm-diffline gbm-diffline-del\" style=\"font-size:10px\">41 −     if (lane.free) return lane.index;<\u002Fdiv>\n            <div class=\"gbm-diffline gbm-diffline-add\" style=\"font-size:10px\">41 +     if (lane.free &amp;&amp; lane.seed != commit) return lane.index;<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;height:24px;padding:0 10px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);font-size:10.5px;color:var(--text-tertiary)\">\n        <span class=\"cal\">6<\u002Fspan><span>merge base 7c3d9e2 · 18 commits · 12 files · +420 −86<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">可比較的組合與入口<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.8fr 1.35fr 1.95fr\" class=\"tbl\">\n        <div class=\"th\">組合<\u002Fdiv><div class=\"th\">入口<\u002Fdiv><div class=\"th\">結果<\u002Fdiv>\n        <sc-for list=\"{{ compares }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ c.pair }}<\u002Fdiv>\n          <div class=\"td\">{{ c.entry }}<\u002Fdiv>\n          <div class=\"td\">{{ c.out }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">Compare 的共通規則<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        兩個 ref 選擇器都吃<strong style=\"color:var(--text-primary)\">同一種下拉<\u002Fstrong>：branch / tag / commit / stash / working copy 混在一份可搜尋清單，以圖示區分類型。所以四種比較不是四個功能，是同一個畫面的不同輸入。<br>\n        方向固定「左是基準、右是新的」，Swap 一鍵對調。<span class=\"gbm-mono\">two-dot<\u002Fspan> 是兩點直接差異，<span class=\"gbm-mono\">three-dot<\u002Fspan> 是從 merge base 起算，預設 three-dot 並在 status 列寫出 merge base 的 hash。<br>\n        Compare 以<strong style=\"color:var(--text-primary)\">分頁<\u002Fstrong>形式開在中央區，與 History / Working Copy 並列，可同時存在多個並各自記憶捲動位置；<span class=\"kbd\">Ctrl/Cmd+W<\u002Fspan> 關閉當前 compare 分頁。<br>\n        結果一律唯讀，唯一例外是與 working copy 比較時可逐檔 checkout 覆蓋，且動作前一定有確認 dialog。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P13 rename + multi-select (260820) ══ -->\n  <sc-if value=\"{{ isP13 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n\n    <div class=\"gbm-panel\" style=\"padding:12px 15px;border-left:2px solid var(--accent)\">\n      <div style=\"font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em\">260820 更新<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85;margin-top:4px\">本頁為新增內容，前 12 頁未改動。兩件事：<strong style=\"color:var(--text-primary)\">branch rename dialog<\u002Fstrong>（含遠端連帶處理），以及<strong style=\"color:var(--text-primary)\">branch / commit 多選<\u002Fstrong>的選取規則與多選後可用的動作。多選連帶影響 P5 context menu（標題改為帶數量）與 P4 menu bar（部分項目在多選時 disabled），詳見本頁末。<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">A · Rename branch — 單一分支<\u002Fdiv>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start\">\n\n        <div class=\"mock\" style=\"width:430px;box-shadow:var(--shadow-lg)\">\n          <div class=\"mkbar\" style=\"height:34px\">\n            <span class=\"cal\">1<\u002Fspan>\n            <span style=\"display:inline-flex\">{{ icPencil }}<\u002Fspan>\n            <span style=\"font-size:11.5px;font-weight:600;color:var(--text-primary)\">Rename branch<\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <span style=\"display:inline-flex\">{{ icClose }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:14px 15px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <div style=\"font-size:10.5px;color:var(--text-tertiary)\">目前名稱<\u002Fdiv>\n              <div class=\"gbm-mono\" style=\"display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-secondary);background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:6px 9px\">{{ icBranch }}feature/lane-allocator<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <div style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">2<\u002Fspan><span style=\"font-size:10.5px;color:var(--text-tertiary)\">新名稱<\u002Fspan><\u002Fdiv>\n              <div class=\"gbm-mono\" style=\"display:flex;align-items:center;font-size:11.5px;color:var(--text-primary);background:var(--surface-panel);border:1px solid var(--accent);border-radius:var(--radius-md);padding:6px 9px\">feature/lane-allocator-v2<span style=\"width:1px;height:13px;background:var(--accent);margin-left:1px\"><\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--success)\">{{ icCheck }}可用 — 無同名分支<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--border-subtle);padding-top:11px\">\n              <div style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">3<\u002Fspan><span style=\"font-size:10.5px;color:var(--text-tertiary)\">遠端連帶處理<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:8px;align-items:flex-start\">\n                <span style=\"width:13px;height:13px;border-radius:3px;border:1.5px solid var(--accent);background:var(--accent);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center\">{{ icCheckWhite }}<\u002Fspan>\n                <span style=\"font-size:11.5px;color:var(--text-primary);line-height:1.55\">一併更名遠端分支<br><span style=\"font-size:10.5px;color:var(--text-tertiary)\">push 新名稱，再刪除 origin/feature/lane-allocator<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;align-items:flex-start;opacity:.55\">\n                <span style=\"width:13px;height:13px;border-radius:3px;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:1px\"><\u002Fspan>\n                <span style=\"font-size:11.5px;line-height:1.55\">只改本地，保留遠端舊分支<br><span style=\"font-size:10.5px;color:var(--text-tertiary)\">新分支的 upstream 會清空<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"gbm-panel\" style=\"display:flex;gap:8px;padding:9px 10px;background:var(--surface-sunken);border:1px solid var(--border-subtle)\">\n              <span style=\"margin-top:1px\">{{ icWarn }}<\u002Fspan>\n              <span style=\"font-size:10.5px;color:var(--text-secondary);line-height:1.6\"><span class=\"cal\" style=\"vertical-align:middle\">4<\u002Fspan> 遠端更名 = delete + push，其他人的 tracking branch 會變成 gone。此分支目前有 2 個未 push 的 commit。<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border-subtle);padding-top:12px\">\n              <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Cancel<\u002Fbutton>\n              <button class=\"gbm-btn gbm-btn-primary gbm-btn-sm\">Rename<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;min-width:330px;display:flex;flex-direction:column;gap:12px\">\n          <div>\n            <div style=\"font-size:11.5px;font-weight:600;margin-bottom:7px\">輸入驗證 — 即時，不等到按 Rename<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1.5fr\" class=\"tbl\">\n              <div class=\"th\">狀況<\u002Fdiv><div class=\"th\">行為<\u002Fdiv>\n              <sc-for list=\"{{ renameValid }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div class=\"td\" style=\"color:var(--text-primary)\">{{ r.case }}<\u002Fdiv>\n                <div class=\"td\">{{ r.act }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"gbm-panel\" style=\"padding:13px 15px\">\n            <div style=\"font-size:12px;font-weight:600;margin-bottom:6px\">開啟方式與範圍<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--text-secondary);line-height:1.9\">\n              入口：branch 右鍵 → Rename、sidebar 選中後按 <span class=\"kbd\">F2<\u002Fspan>、Repository 選單 → Rename branch。<br>\n              只有<strong style=\"color:var(--text-primary)\">本地分支<\u002Fstrong>可更名。純遠端分支的 Rename 為 disabled，tooltip 寫「先 checkout 建立本地分支」。<br>\n              目前分支也可更名，不需要先切走；HEAD 會跟著移動。<br>\n              tag 沒有 rename，只有 delete + create（git 沒有原子更名），dialog 會直接這樣說明。<br>\n              執行過程與失敗訊息走 P10 的背景作業列與錯誤視窗，不留在 dialog 裡轉圈。\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">B · 多選 — branch 與 commit 的選取規則<\u002Fdiv>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start\">\n\n        <div class=\"mock\" style=\"width:290px\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">5<\u002Fspan>Branches — 3 selected<\u002Fdiv>\n          <div style=\"padding:5px;display:flex;flex-direction:column;gap:1px\">\n            <div class=\"gbm-row\" style=\"height:26px;font-size:11px;gap:7px\">{{ icBranch }}<span style=\"flex:1\">main<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">↑2<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row selected\" style=\"height:26px;font-size:11px;gap:7px\">{{ icBranch }}<span style=\"flex:1\">feature/graph-cache<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row selected\" style=\"height:26px;font-size:11px;gap:7px\">{{ icBranch }}<span style=\"flex:1\">feature/lane-allocator<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row\" style=\"height:26px;font-size:11px;gap:7px\">{{ icBranch }}<span style=\"flex:1\">release/0.5<\u002Fspan><\u002Fdiv>\n            <div class=\"gbm-row selected\" style=\"height:26px;font-size:11px;gap:7px;outline:1px solid var(--accent);outline-offset:-1px\">{{ icBranch }}<span style=\"flex:1\">wip/askpass<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9px;color:var(--text-tertiary)\">anchor<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px;height:24px;padding:0 9px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);font-size:10px;color:var(--text-tertiary)\"><span class=\"cal\">6<\u002Fspan>3 branches selected<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mock\" style=\"width:250px;box-shadow:var(--shadow-lg)\">\n          <div style=\"padding:5px 0\">\n            <div style=\"padding:5px 11px 6px;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-tertiary);border-bottom:1px solid var(--border-subtle);display:flex;gap:6px;align-items:center\"><span class=\"cal\">7<\u002Fspan>3 branches<\u002Fdiv>\n            <sc-for list=\"{{ multiBranchMenu }}\" as=\"m\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:5px 11px;font-size:11.5px;opacity:{{ m.op }};color:{{ m.color }}\">\n                <span style=\"flex:1\">{{ m.label }}<\u002Fspan>\n                <span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">{{ m.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mock\" style=\"flex:1;min-width:320px\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">8<\u002Fspan>History — 4 commits selected（連續範圍）<\u002Fdiv>\n          <div style=\"padding:5px;display:flex;flex-direction:column;gap:1px\">\n            <sc-for list=\"{{ multiCommits }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div class=\"gbm-row {{ c.selCls }}\" style=\"height:26px;font-size:11px;gap:8px\">\n                <span style=\"width:6px;height:6px;border-radius:999px;background:{{ c.lane }};flex-shrink:0\"><\u002Fspan>\n                <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.msg }}<\u002Fspan>\n                <span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">{{ c.sha }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px;height:24px;padding:0 9px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);font-size:10px;color:var(--text-tertiary)\"><span class=\"cal\">9<\u002Fspan>4 commits · 連續 · 9 files changed · +311 −54<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start\">\n      <div>\n        <div style=\"font-size:12px;font-weight:600;margin-bottom:8px\">選取操作（三平台一致，只換修飾鍵）<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:.85fr 1.3fr\" class=\"tbl\">\n          <div class=\"th\">操作<\u002Fdiv><div class=\"th\">結果<\u002Fdiv>\n          <sc-for list=\"{{ multiKeys }}\" as=\"k\" hint-placeholder-count=\"7\">\n            <div class=\"td\" style=\"color:var(--text-primary)\">{{ k.key }}<\u002Fdiv>\n            <div class=\"td\">{{ k.act }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;font-weight:600;margin-bottom:8px\">多選時的動作可用性<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:.55fr .8fr 1.3fr\" class=\"tbl\">\n          <div class=\"th\">對象<\u002Fdiv><div class=\"th\">動作<\u002Fdiv><div class=\"th\">多選行為<\u002Fdiv>\n          <sc-for list=\"{{ multiActs }}\" as=\"a\" hint-placeholder-count=\"9\">\n            <div class=\"td\" style=\"color:var(--text-primary)\">{{ a.obj }}<\u002Fdiv>\n            <div class=\"td\" style=\"color:{{ a.color }}\">{{ a.act }}<\u002Fdiv>\n            <div class=\"td\">{{ a.behav }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">多選的共通規則<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        單選是多選的特例：所有清單一律維持一組 selection + 一個 anchor，<span class=\"kbd\">Shift<\u002Fspan> 以 anchor 為起點取範圍，<span class=\"kbd\">Ctrl/Cmd<\u002Fspan> 逐項切換並把 anchor 移到最後點的那一項。<br>\n        右鍵點在<strong style=\"color:var(--text-primary)\">已選中<\u002Fstrong>的項目上不改變 selection，選單標題顯示數量；點在未選中的項目上先改為只選它、再開選單，避免對看不見的選取做動作。<br>\n        對多選只出現「對每一項都有意義」的動作。單項專屬動作（Rename、Checkout、Set upstream）在多選時<strong style=\"color:var(--text-primary)\">保留但 disabled<\u002Fstrong>，並附 tooltip 說明原因，不隱藏 — 隱藏會讓人以為功能不存在。<br>\n        commit 多選只在<strong style=\"color:var(--text-primary)\">連續範圍<\u002Fstrong>時開放 cherry-pick / revert / squash；不連續時這三項 disabled，tooltip 寫「選取需為連續 commit」。狀態列一律寫出是否連續。<br>\n        破壞性批次動作（Delete branches、Drop stashes）的確認 dialog 逐項列出名稱與未 push 的 commit 數，並區分「本地」與「遠端」兩份清單，不用一句「刪除 3 個分支？」概括。<br>\n        批次執行依序進行、失敗不中斷其餘項目；結束後在 P10 背景列給一行結果摘要（例如「刪除 3 個分支：2 成功、1 失敗」），失敗項可從錯誤視窗重試。<br>\n        Selection 在切換分頁與重新整理後保留，切換 repository 時清空。<span class=\"kbd\">Esc<\u002Fspan> 縮回單選（保留 anchor 那一項），<span class=\"kbd\">Ctrl/Cmd+A<\u002Fspan> 全選當前清單。\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px;border-left:2px solid var(--accent)\">\n      <div style=\"font-size:12px;font-weight:600;margin-bottom:6px\">對既有頁面的連帶修改（尚未套用到前 12 頁）<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goP5 }}\">P5 Context menu<\u002Fa>：branch / commit / file / stash 四種選單需加「多選標題列（N items）」與 disabled 變體。<br>\n        <a href=\"#\" sc-camel-on-click=\"{{ goP2 }}\">P2 History<\u002Fa>：狀態列改為顯示 selection 摘要（數量、是否連續、合計 diff）。<br>\n        <a href=\"#\" sc-camel-on-click=\"{{ goP10 }}\">P10 Log<\u002Fa>：批次作業以單一父項顯示，展開才是逐項結果。<br>\n        P4 Menu bar：Repository 選單新增 Rename branch（<span class=\"kbd\">F2<\u002Fspan>）；Edit 選單新增 Select all（<span class=\"kbd\">Ctrl/Cmd+A<\u002Fspan>）。<br>\n        說一聲要不要我直接把這四處改進前面的頁面。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P14 進階功能入口 IA (260820) ══ -->\n  <sc-if value=\"{{ isP14 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n\n    <div class=\"gbm-panel\" style=\"padding:12px 15px;border-left:2px solid var(--accent)\">\n      <div style=\"font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em\">260820 更新<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85;margin-top:4px\">24 個已出貨但沒設計過的畫面，第一個問題不是長什麼樣，而是<strong style=\"color:var(--text-primary)\">該用哪種載體、從哪裡進去<\u002Fstrong>。目前它們唯一的入口是分頁列右側的溢出選單（18 項、Title Case），違反「入口只能是 context menu 或 menu bar」這條原本的規則。本頁定的就是這件事。<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">一、載體判定 — 24 個畫面歸四類<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.62fr 1.5fr .8fr 1.35fr\" class=\"tbl\">\n        <div class=\"th\">分組<\u002Fdiv><div class=\"th\">畫面<\u002Fdiv><div class=\"th\">載體<\u002Fdiv><div class=\"th\">理由<\u002Fdiv>\n        <sc-for list=\"{{ iaMap }}\" as=\"i\" hint-placeholder-count=\"4\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ i.grp }}<\u002Fdiv>\n          <div class=\"td gbm-mono\" style=\"font-size:10.5px\">{{ i.items }}<\u002Fdiv>\n          <div class=\"td\" style=\"color:var(--accent)\">{{ i.to }}<\u002Fdiv>\n          <div class=\"td\">{{ i.why }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">二、入口 — menu bar 新增 Tools，context menu 補第二層 flyout<\u002Fdiv>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start\">\n\n        <div class=\"mock\" style=\"width:660px;flex:0 0 660px;max-width:100%\">\n          <div class=\"mkbar\" style=\"height:30px;gap:14px\">\n            <span style=\"font-size:11.5px\">File<\u002Fspan><span style=\"font-size:11.5px\">Edit<\u002Fspan><span style=\"font-size:11.5px\">View<\u002Fspan>\n            <span style=\"font-size:11.5px\">Repository<\u002Fspan><span style=\"font-size:11.5px\">Branch<\u002Fspan><span style=\"font-size:11.5px\">Remote<\u002Fspan>\n            <span style=\"font-size:11.5px;color:var(--text-on-accent);background:var(--accent);padding:2px 7px;border-radius:var(--radius-sm)\">Tools<\u002Fspan>\n            <span style=\"font-size:11.5px\">Help<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:250px;background:var(--surface-app)\">\n            <div style=\"position:absolute;left:60px;top:2px;width:196px;background:var(--surface-panel);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:4px 0\">\n              <sc-for list=\"{{ toolsMenu }}\" as=\"m\" hint-placeholder-count=\"8\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:5px 11px;font-size:11.5px\">\n                  <span style=\"flex:1\">{{ m.label }}<\u002Fspan>\n                  <span class=\"gbm-mono\" style=\"font-size:9px;color:var(--text-tertiary)\">{{ m.note }}<\u002Fspan>\n                  <span style=\"display:inline-flex\">{{ m.arrow }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:254px;top:150px;width:184px;background:var(--surface-panel);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:4px 0\">\n              <sc-for list=\"{{ toolsSub }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"padding:5px 11px;font-size:11.5px;color:{{ m.color }}\">{{ m.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span class=\"cal cal-o\" style=\"left:8px;top:8px\">1<\u002Fspan>\n            <span class=\"cal cal-o\" style=\"left:460px;top:154px\">2<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mock\" style=\"width:400px\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">3<\u002Fspan>File context menu — 維持 8 項上限<\u002Fdiv>\n          <div style=\"position:relative;height:236px;background:var(--surface-app)\">\n            <div style=\"position:absolute;left:14px;top:12px;width:190px;background:var(--surface-panel);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:4px 0\">\n              <sc-for list=\"{{ fileCtx }}\" as=\"m\" hint-placeholder-count=\"8\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:5px 11px;font-size:11.5px;color:{{ m.color }};background:{{ m.bg }}\">\n                  <span style=\"flex:1\">{{ m.label }}<\u002Fspan>\n                  <span style=\"display:inline-flex\">{{ m.arrow }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:202px;top:106px;width:172px;background:var(--surface-panel);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:4px 0\">\n              <sc-for list=\"{{ fileCtxSub }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;gap:8px;padding:5px 11px;font-size:11.5px\"><span style=\"flex:1\">{{ m.label }}<\u002Fspan><span class=\"gbm-mono\" style=\"font-size:9px;color:var(--text-tertiary)\">{{ m.note }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span class=\"cal cal-o\" style=\"left:210px;top:200px\">4<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">規則<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        <span class=\"cal\" style=\"vertical-align:middle\">1<\u002Fspan> menu bar 新增一個 <strong style=\"color:var(--text-primary)\">Tools<\u002Fstrong> 選單，收所有 repo-scoped 的進階面板。放在 Remote 之後、Help 之前；它是「開一個面板」而不是「對目前分支做事」，所以不塞進 Repository。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">2<\u002Fspan> 破壞性或多步驟的三項（Interactive rebase、Bisect、Clean untracked files）收進 <span class=\"gbm-mono\">Rewrite history<\u002Fspan> 第二層，不與唯讀面板同層 —— 手滑點到的代價差太多。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">3<\u002Fspan> context menu 的 8 項上限保留。要塞第 9 項時，作法是把同族動作收成一個 flyout（如 <span class=\"gbm-mono\">History<\u002Fspan>），不是把項目擠掉。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">4<\u002Fspan> flyout 為兩層上限，不做第三層；hover 120ms 後展開，鍵盤 <span class=\"kbd\">→<\u002Fspan> 進入、<span class=\"kbd\">←<\u002Fspan> 退出。<br>\n        分頁列右側的 18 項溢出選單在 Tools 與 flyout 上線後<strong style=\"color:var(--text-primary)\">刪除<\u002Fstrong>。同一功能不留兩條路。<br>\n        所有標籤一律 sentence case，動詞開頭，會開 dialog 的加 <span class=\"gbm-mono\">…<\u002Fspan>。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P15 空狀態與錯誤視窗 (260820) ══ -->\n  <sc-if value=\"{{ isP15 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n\n    <div class=\"gbm-panel\" style=\"padding:12px 15px;border-left:2px solid var(--accent)\">\n      <div style=\"font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em\">260820 更新<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85;margin-top:4px\">兩個之前只有規則沒有版面的東西：沒開任何 repository 時的畫面（原本的世界觀是「一個視窗就是一個 repository」，但第一次啟動確實會遇到），以及 P10 定義過行為卻沒畫過的錯誤視窗。<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">A · 沒有開啟 repository 的視窗<\u002Fdiv>\n      <div class=\"mock\">\n        <div class=\"mkbar\" style=\"height:30px;gap:14px\">\n          <span style=\"font-size:11.5px\">File<\u002Fspan><span style=\"font-size:11.5px\">Edit<\u002Fspan>\n          <span style=\"font-size:11.5px;opacity:.45\">View<\u002Fspan><span style=\"font-size:11.5px;opacity:.45\">Repository<\u002Fspan>\n          <span style=\"font-size:11.5px;opacity:.45\">Branch<\u002Fspan><span style=\"font-size:11.5px;opacity:.45\">Remote<\u002Fspan>\n          <span style=\"font-size:11.5px;opacity:.45\">Tools<\u002Fspan><span style=\"font-size:11.5px\">Help<\u002Fspan>\n          <span style=\"flex:1\"><\u002Fspan><span class=\"cal\">1<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;height:352px\">\n          <div class=\"mkpane\" style=\"width:246px;border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px\">\n            <span class=\"cal\">2<\u002Fspan>\n            <div style=\"font-size:11px;color:var(--text-tertiary);text-align:center;line-height:1.7\">Sidebar 保留但為空<br>不畫假的分支清單<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:22px 26px;min-width:0\">\n            <div style=\"display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap;justify-content:center\">\n              <div style=\"display:flex;flex-direction:column;gap:14px;max-width:280px\">\n                <div style=\"display:flex;gap:7px;align-items:center\"><span class=\"cal\">3<\u002Fspan><span style=\"font-size:17px;font-weight:600;letter-spacing:-.01em\">git-branch-manager<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--text-tertiary);line-height:1.75\">沒有開啟的 repository。掃描的來源資料夾設定在 Preferences → Repositories。<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <sc-for list=\"{{ welcomeActs }}\" as=\"w\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;align-items:center;gap:8px\">\n                      <button class=\"gbm-btn {{ w.cls }} gbm-btn-sm\" style=\"width:172px;justify-content:flex-start\">{{ w.label }}<\u002Fbutton>\n                      <span class=\"kbd\">{{ w.key }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px;min-width:260px\">\n                <div style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">4<\u002Fspan><span style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)\">Recent<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:1px\">\n                  <sc-for list=\"{{ recents }}\" as=\"r\" hint-placeholder-count=\"3\">\n                    <div class=\"gbm-row\" style=\"height:38px;gap:9px;align-items:center\">\n                      <span style=\"display:inline-flex\">{{ icFolderOpen }}<\u002Fspan>\n                      <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:1px\">\n                        <span style=\"font-size:11.5px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.name }}<\u002Fspan>\n                        <span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.path }}<\u002Fspan>\n                      <\u002Fspan>\n                      <span style=\"font-size:9.5px;color:var(--text-tertiary);flex-shrink:0\">{{ r.meta }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;height:24px;padding:0 10px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);font-size:10.5px;color:var(--text-tertiary)\"><span class=\"cal\">5<\u002Fspan><span>掃描 3 個來源資料夾 · 找到 41 個 repository · 331 ms<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gbm-panel\" style=\"padding:13px 15px;margin-top:12px\">\n        <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n          <span class=\"cal\" style=\"vertical-align:middle\">1<\u002Fspan> menu bar 不隱藏，只把需要 repo 的選單 disabled —— 讓人看得到功能在哪，而不是覺得程式壞了。<br>\n          <span class=\"cal\" style=\"vertical-align:middle\">2<\u002Fspan> sidebar 結構保留、內容為空，切到第一個 repo 時版面不會跳動。<br>\n          <span class=\"cal\" style=\"vertical-align:middle\">3<\u002Fspan> 沒有 logo，產品名直接排字（設計系統的規定）。無插圖、無標語。<br>\n          <span class=\"cal\" style=\"vertical-align:middle\">4<\u002Fspan> Recent 最多 8 筆，右鍵可移除單筆或清空；路徑已不存在的顯示為刪除線並附「找不到路徑」。<br>\n          <span class=\"cal\" style=\"vertical-align:middle\">5<\u002Fspan> 狀態列寫出實際掃描結果與耗時，不寫「準備就緒」這種沒有資訊的字。<br>\n          此畫面只在「一個 repo 都沒開」時出現。關掉最後一個 repo 分頁會回到這裡，不是關閉視窗。\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">B · 錯誤視窗 — P10 規則的版面<\u002Fdiv>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start\">\n        <div class=\"mock\" style=\"width:470px;box-shadow:var(--shadow-lg)\">\n          <div class=\"mkbar\" style=\"height:34px\">\n            <span class=\"cal\">6<\u002Fspan>\n            <span style=\"display:inline-flex\">{{ icErrBig }}<\u002Fspan>\n            <span style=\"font-size:11.5px;font-weight:600;color:var(--text-primary)\">Push 失敗<\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary)\">×3<\u002Fspan>\n            <span style=\"display:inline-flex\">{{ icClose }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:14px 15px;display:flex;flex-direction:column;gap:11px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <div style=\"font-size:12.5px;color:var(--text-primary);line-height:1.6\">推送 <span class=\"gbm-mono\">feature/lane-allocator<\u002Fspan> 到 <span class=\"gbm-mono\">origin<\u002Fspan> 失敗。<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:var(--text-secondary);line-height:1.7\"><span class=\"cal\" style=\"vertical-align:middle\">7<\u002Fspan> 遠端有 4 個本地沒有的 commit。非 fast-forward 的推送會覆蓋別人的紀錄，所以被拒絕。<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden\">\n              <div style=\"display:flex;align-items:center;gap:6px;padding:6px 9px;background:var(--surface-sunken);font-size:10.5px;color:var(--text-secondary)\">\n                <span style=\"display:inline-flex\">{{ icChevDown }}<\u002Fspan><span style=\"flex:1\"><span class=\"cal\" style=\"vertical-align:middle\">8<\u002Fspan> git 原始輸出<\u002Fspan><span style=\"display:inline-flex\">{{ icCopy }}<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"gbm-mono\" style=\"padding:8px 9px;font-size:10px;color:var(--text-secondary);line-height:1.65;background:var(--surface-panel)\">$ git push origin feature/lane-allocator<br>! [rejected] feature/lane-allocator -&gt; feature/lane-allocator (non-fast-forward)<br>error: failed to push some refs to 'origin'<br>exit 1 · 412 ms<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:center;border-top:1px solid var(--border-subtle);padding-top:12px\">\n              <span class=\"cal\">9<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Open log<\u002Fbutton>\n              <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Close<\u002Fbutton>\n              <button class=\"gbm-btn gbm-btn-primary gbm-btn-sm\">Pull then push<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;min-width:320px;display:flex;flex-direction:column;gap:12px\">\n          <div>\n            <div style=\"font-size:11.5px;font-weight:600;margin-bottom:7px\">七種案例的主按鈕（ERRCASES）<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1.1fr .4fr .8fr\" class=\"tbl\">\n              <div class=\"th\">錯誤<\u002Fdiv><div class=\"th\">呈現<\u002Fdiv><div class=\"th\">主按鈕<\u002Fdiv>\n              <sc-for list=\"{{ errCases }}\" as=\"e\" hint-placeholder-count=\"7\">\n                <div class=\"td\" style=\"color:var(--text-primary)\">{{ e.err }}<\u002Fdiv>\n                <div class=\"td\">{{ e.mode }}<\u002Fdiv>\n                <div class=\"td\" style=\"color:var(--accent)\">{{ e.action }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"gbm-panel\" style=\"padding:13px 15px\">\n            <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n              <span class=\"cal\" style=\"vertical-align:middle\">6<\u002Fspan> 三段式固定順序：做了什麼失敗 → 為什麼 → git 原始輸出。標題只寫動作與結果，不寫 git 的英文。<br>\n              <span class=\"cal\" style=\"vertical-align:middle\">7<\u002Fspan> 原因用具體數字，不寫「發生未知錯誤」。<br>\n              <span class=\"cal\" style=\"vertical-align:middle\">8<\u002Fspan> 原始輸出預設<strong style=\"color:var(--text-primary)\">展開<\u002Fstrong>（工程使用者會看），等寬字、可複製、含 exit code 與耗時。<br>\n              <span class=\"cal\" style=\"vertical-align:middle\">9<\u002Fspan> 主按鈕是下一步動作而非「確定」；Open log 跳到 P10 抽屜對應那一列。<br>\n              同一錯誤重複發生不重開視窗，標題列累加 <span class=\"gbm-mono\">×3<\u002Fspan>。<br>\n              視窗而非 inline banner 的判準：需要使用者做決定的用視窗；只是通知結果的留在 log 抽屜與狀態列。\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P16 規格修訂 (260820) ══ -->\n  <sc-if value=\"{{ isP16 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">已改的行 — 前面各頁的表已同步更新<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.42fr 1.2fr 1.35fr\" class=\"tbl\">\n        <div class=\"th\">位置<\u002Fdiv><div class=\"th\">原本<\u002Fdiv><div class=\"th\">改成<\u002Fdiv>\n        <sc-for list=\"{{ revisions }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ r.area }}<\u002Fdiv>\n          <div class=\"td\">{{ r.was }}<\u002Fdiv>\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ r.now }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">要你拍板的<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <sc-for list=\"{{ openQ }}\" as=\"o\" hint-placeholder-count=\"4\">\n          <div class=\"gbm-panel\" style=\"padding:12px 15px\">\n            <div style=\"font-size:12px;font-weight:600;margin-bottom:4px\">{{ o.q }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--text-secondary);line-height:1.8\">{{ o.d }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">這一輪的範圍<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        已補：Tier C 12 張流程 dialog 在 P17、Tier B-2 8 張修復類在 P18、管理面板樣板（manage-worktrees + 其餘 11 個的欄位表）在 P19、Tier F 3 張在 P20、Pull 流程與六種失敗在 P21。<br>\n        12 個管理面板刻意只畫一張樣板：<a href=\"#\" sc-camel-on-click=\"{{ goP14 }}\">P14<\u002Fa> 已經把它們定成同一種分頁造型，各畫一張只會讓它們慢慢長歪。要哪一個獨立畫出來說一聲。<br>\n        Tier F 那三張不列入現階段驗收（缺 capi 的 blob 讀取）。<br>\n        P1 的 Windows / Linux 自訂標題列<strong style=\"color:var(--text-primary)\">保留在規格中但降為選配<\u002Fstrong>：先用系統標題列出貨，這樣少一個依賴卡住主畫面。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ P17 / P18 / P20 dialog 版面 (260820) ══ -->\n  <sc-if value=\"{{ isP17 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel\" style=\"padding:12px 15px;border-left:2px solid var(--accent)\">\n      <div style=\"font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em\">260820 更新<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85;margin-top:4px\">P6 的共用外殼直接套到每一個：18px semibold 標題列、16px padding 內容區、右對齊動作列、<span class=\"kbd\">Esc<\u002Fspan> 取消 / <span class=\"kbd\">Enter<\u002Fspan> 執行、破壞性主按鈕用 danger 且複述具體對象。所以下面每一張的重點只有「有哪些欄位、預設值是什麼、警告在第幾行」。欄位一律單欄堆疊，不做左右兩欄 — 對話框最寬 480px。<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start\">\n      <sc-for list=\"{{ dlgsC }}\" as=\"d\" hint-placeholder-count=\"11\">\n        <div class=\"mock\" style=\"box-shadow:var(--shadow-lg)\">\n          <div class=\"mkbar\" style=\"height:32px\">\n            <span style=\"font-size:11.5px;font-weight:600;color:var(--text-primary);flex:1\">{{ d.name }}<\u002Fspan>\n            <span class=\"kbd\" style=\"display:{{ d.keyDisp }}\">{{ d.key }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:13px 14px;display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ d.fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                <div style=\"display:{{ f.labelDisp }};font-size:10px;letter-spacing:.04em;color:var(--text-tertiary)\">{{ f.label }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-start;gap:8px\">\n                  <span style=\"{{ f.markStyle }}\"><\u002Fspan>\n                  <span style=\"{{ f.boxStyle }}\">{{ f.v }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:{{ f.hintDisp }};font-size:10px;color:var(--text-tertiary);line-height:1.6\">{{ f.hint }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;gap:7px;justify-content:flex-end;border-top:1px solid var(--border-subtle);padding-top:11px\">\n              <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Cancel<\u002Fbutton>\n              <button class=\"{{ d.btnCls }}\">{{ d.primary }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isP18 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel\" style=\"padding:12px 15px;border-left:2px solid var(--accent)\">\n      <div style=\"font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em\">260820 更新<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85;margin-top:4px\">這八張的共同性格：都是在「出事了或要動到歷史」的時刻出現，所以一律先寫<strong style=\"color:var(--text-primary)\">實際會發生什麼<\u002Fstrong>（具體檔名、數量、指令原文），再給按鈕；主按鈕永遠是下一步動作而不是「確定」。Checkout blocked 與 Deleted branch recovery 是唯二不由使用者主動叫出的 — 前者接在失敗之後，後者接在刪除之後。<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start\">\n      <sc-for list=\"{{ dlgsB2 }}\" as=\"d\" hint-placeholder-count=\"8\">\n        <div class=\"mock\" style=\"box-shadow:var(--shadow-lg)\">\n          <div class=\"mkbar\" style=\"height:32px\">\n            <span style=\"font-size:11.5px;font-weight:600;color:var(--text-primary);flex:1\">{{ d.name }}<\u002Fspan>\n            <span class=\"kbd\" style=\"display:{{ d.keyDisp }}\">{{ d.key }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:13px 14px;display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ d.fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                <div style=\"display:{{ f.labelDisp }};font-size:10px;letter-spacing:.04em;color:var(--text-tertiary)\">{{ f.label }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-start;gap:8px\">\n                  <span style=\"{{ f.markStyle }}\"><\u002Fspan>\n                  <span style=\"{{ f.boxStyle }}\">{{ f.v }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:{{ f.hintDisp }};font-size:10px;color:var(--text-tertiary);line-height:1.6\">{{ f.hint }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;gap:7px;justify-content:flex-end;border-top:1px solid var(--border-subtle);padding-top:11px\">\n              <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Cancel<\u002Fbutton>\n              <button class=\"{{ d.btnCls }}\">{{ d.primary }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isP19 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel\" style=\"padding:12px 15px;border-left:2px solid var(--accent)\">\n      <div style=\"font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em\">260820 更新<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85;margin-top:4px\">12 個管理面板不畫 12 張圖，因為它們是同一張圖：<strong style=\"color:var(--text-primary)\">分頁標題 → 工具列 → 左清單 → 右明細 → 狀態列<\u002Fstrong>，與 P12 Compare 同型。下面用 manage-worktrees 當實例，再用一張表列出其餘 11 個各自往那四格填什麼。<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mock\">\n      <div style=\"display:flex;align-items:center;gap:2px;height:30px;padding:0 8px;background:var(--surface-sunken);border-bottom:1px solid var(--border-subtle)\">\n        <span style=\"font-size:11px;color:var(--text-tertiary);padding:0 9px\">History<\u002Fspan>\n        <span style=\"font-size:11px;color:var(--text-tertiary);padding:0 9px\">Working copy<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-primary);padding:0 9px;height:30px;border-bottom:2px solid var(--accent)\"><span class=\"cal\">1<\u002Fspan>Worktrees<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mkbar\" style=\"height:34px;gap:7px\">\n        <span class=\"cal\">2<\u002Fspan>\n        <button class=\"gbm-btn gbm-btn-primary gbm-btn-sm\">Add worktree…<\u002Fbutton>\n        <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Prune<\u002Fbutton>\n        <span style=\"width:1px;height:15px;background:var(--border-subtle)\"><\u002Fspan>\n        <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Open in terminal<\u002Fbutton>\n        <span style=\"flex:1\"><\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border:1px solid var(--border-default);border-radius:var(--radius-md)\">{{ icSearch }}Filter<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;height:292px\">\n        <div class=\"mkpane\" style=\"width:300px;display:flex;flex-direction:column\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">3<\u002Fspan>Worktrees · 4<\u002Fdiv>\n          <div style=\"padding:5px;display:flex;flex-direction:column;gap:1px\">\n            <sc-for list=\"{{ wts }}\" as=\"w\" hint-placeholder-count=\"4\">\n              <div class=\"gbm-row {{ w.selCls }}\" style=\"height:36px;gap:8px;align-items:center\">\n                <span style=\"display:inline-flex\">{{ w.icon }}<\u002Fspan>\n                <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:1px\">\n                  <span style=\"font-size:11.5px;color:{{ w.color }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ w.name }}<\u002Fspan>\n                  <span class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ w.br }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"font-size:9px;color:var(--text-tertiary);flex-shrink:0\">{{ w.badge }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split-v\"><\u002Fdiv>\n        <div class=\"mkpane\" style=\"flex:1;display:flex;flex-direction:column;min-width:0\">\n          <div class=\"mklbl\" style=\"display:flex;gap:6px;align-items:center\"><span class=\"cal\">4<\u002Fspan>git-branch-manager<\u002Fdiv>\n          <div style=\"padding:12px 14px;display:flex;flex-direction:column;gap:9px\">\n            <div style=\"display:grid;grid-template-columns:78px 1fr;gap:7px 10px;font-size:11px\">\n              <span style=\"color:var(--text-tertiary)\">路徑<\u002Fspan><span class=\"gbm-mono\" style=\"color:var(--text-primary)\">~/src/git-branch-manager<\u002Fspan>\n              <span style=\"color:var(--text-tertiary)\">分支<\u002Fspan><span class=\"gbm-mono\" style=\"color:var(--text-primary)\">main ↑2<\u002Fspan>\n              <span style=\"color:var(--text-tertiary)\">HEAD<\u002Fspan><span class=\"gbm-mono\" style=\"color:var(--text-primary)\">a1b2c3d · Fix lane allocator overflow<\u002Fspan>\n              <span style=\"color:var(--text-tertiary)\">狀態<\u002Fspan><span style=\"color:var(--text-primary)\">9 個未提交變更 · 未鎖定<\u002Fspan>\n              <span style=\"color:var(--text-tertiary)\">建立於<\u002Fspan><span style=\"color:var(--text-secondary)\">2026-06-02 14:41<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:7px;border-top:1px solid var(--border-subtle);padding-top:11px\">\n              <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Switch to<\u002Fbutton>\n              <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Lock<\u002Fbutton>\n              <span style=\"flex:1\"><\u002Fspan>\n              <button class=\"gbm-btn gbm-btn-danger gbm-btn-sm\">Remove worktree…<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"gbm-panel\" style=\"display:flex;gap:8px;padding:9px 10px;background:var(--surface-sunken);border:1px solid var(--border-subtle)\">\n              <span style=\"margin-top:1px\">{{ icWarn }}<\u002Fspan>\n              <span style=\"font-size:10.5px;color:var(--text-secondary);line-height:1.6\"><span class=\"cal\" style=\"vertical-align:middle\">5<\u002Fspan> gbm-lfs 的路徑已不存在。Prune 會把它從 git 的紀錄中移除，不會刪任何檔案。<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;height:24px;padding:0 10px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);font-size:10.5px;color:var(--text-tertiary)\"><span class=\"cal\">6<\u002Fspan><span>4 worktrees · 1 個路徑失效 · 掃描 118 ms<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">樣板規則（12 個面板共用）<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        <span class=\"cal\" style=\"vertical-align:middle\">1<\u002Fspan> 以分頁開啟，與 History / Working copy / Compare 共用同一條分頁列；可同時開多個、各自記憶捲動位置與 splitter，<span class=\"kbd\">Ctrl/Cmd+W<\u002Fspan> 關閉。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">2<\u002Fspan> 工具列固定四段：主要建立動作（primary）、批次維護動作（ghost）、分隔線、跳出去的動作；右端固定是 filter。破壞性動作不放工具列，只在明細區或右鍵。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">3<\u002Fspan> 左清單為單選，欄寬可拖曳、下限 220px；行高沿用 comfortable 34px（此處 36px 因為兩行式）。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">4<\u002Fspan> 右明細一律是 <span class=\"gbm-mono\">78px 標籤 + 值<\u002Fspan> 的定義列表，值可選取複製；動作列在明細底部，danger 靠右。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">5<\u002Fspan> 例外狀態用面板內 banner，不用 dialog、不用 toast。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">6<\u002Fspan> 狀態列一律寫實際數量與耗時。<br>\n        interactive-rebase 與 bisect 是唯二左清單可寫入的（拖曳排序、標記 good/bad），其餘 10 個左清單唯讀。\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">其餘 11 個往四格填什麼<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.72fr 1.05fr 1.25fr 1fr\" class=\"tbl\">\n        <div class=\"th\">面板<\u002Fdiv><div class=\"th\">左清單<\u002Fdiv><div class=\"th\">右明細<\u002Fdiv><div class=\"th\">工具列<\u002Fdiv>\n        <sc-for list=\"{{ panelSpec }}\" as=\"p\" hint-placeholder-count=\"12\">\n          <div class=\"td gbm-mono\" style=\"color:var(--text-primary);font-size:10.5px\">{{ p.p }}<\u002Fdiv>\n          <div class=\"td\">{{ p.list }}<\u002Fdiv>\n          <div class=\"td\">{{ p.detail }}<\u002Fdiv>\n          <div class=\"td\">{{ p.bar }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isP20 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel\" style=\"padding:12px 15px;border-left:2px solid var(--accent)\">\n      <div style=\"font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em\">260820 更新<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85;margin-top:4px\">這三個功能還沒實作。版面先畫好，但<strong style=\"color:var(--text-primary)\">不列入現階段驗收<\u002Fstrong> — 後兩者需要 capi 的 blob 讀取能力。畫在這裡的用途是：實作時不用再回來問長怎樣，且能先確認欄位需求是否影響 capi 的介面設計。<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start\">\n      <sc-for list=\"{{ dlgsF }}\" as=\"d\" hint-placeholder-count=\"3\">\n        <div class=\"mock\" style=\"box-shadow:var(--shadow-lg)\">\n          <div class=\"mkbar\" style=\"height:32px\">\n            <span style=\"font-size:11.5px;font-weight:600;color:var(--text-primary);flex:1\">{{ d.name }}<\u002Fspan>\n            <span class=\"kbd\" style=\"display:{{ d.keyDisp }}\">{{ d.key }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:13px 14px;display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ d.fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                <div style=\"display:{{ f.labelDisp }};font-size:10px;letter-spacing:.04em;color:var(--text-tertiary)\">{{ f.label }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-start;gap:8px\">\n                  <span style=\"{{ f.markStyle }}\"><\u002Fspan>\n                  <span style=\"{{ f.boxStyle }}\">{{ f.v }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:{{ f.hintDisp }};font-size:10px;color:var(--text-tertiary);line-height:1.6\">{{ f.hint }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;gap:7px;justify-content:flex-end;border-top:1px solid var(--border-subtle);padding-top:11px\">\n              <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Cancel<\u002Fbutton>\n              <button class=\"{{ d.btnCls }}\">{{ d.primary }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isP21 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div class=\"gbm-panel\" style=\"padding:12px 15px;border-left:2px solid var(--accent)\">\n      <div style=\"font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em\">260820 更新<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.85;margin-top:4px\">Pull 之前只有工具列上一顆按鈕，沒有寫過它其實是<strong style=\"color:var(--text-primary)\">兩段作業<\u002Fstrong>（fetch + 套用），也沒定義六種失敗各自接到哪裡。原則：一般情況一鍵完成不問問題；需要決定時才出 dialog，而且每個 dialog 都能<strong style=\"color:var(--text-primary)\">直接把原本的 pull 做完<\u002Fstrong>，不是叫使用者回去重按。<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">四段式流程 — 每段的可取消性不同<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\">\n        <sc-for list=\"{{ pullSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div class=\"gbm-panel\" style=\"padding:12px 13px;display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;align-items:center;gap:7px\"><span class=\"cal\">{{ s.n }}<\u002Fspan><span style=\"font-size:12px;font-weight:600\">{{ s.t }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--text-secondary);line-height:1.7\">{{ s.d }}<\u002Fdiv>\n            <div class=\"gbm-mono\" style=\"font-size:9.5px;color:var(--accent);margin-top:auto\">{{ s.s }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mock\">\n      <div class=\"mkbar\" style=\"height:34px;gap:7px\">\n        <span class=\"cal\">5<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border:1px solid var(--border-default);border-radius:var(--radius-md)\">{{ icFetch }}Fetch<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border:1px solid var(--accent);border-radius:var(--radius-md);color:var(--accent)\">{{ icPull }}Pull<span class=\"gbm-mono\" style=\"font-size:9px\">4<\u002Fspan><\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border:1px solid var(--border-default);border-radius:var(--radius-md)\">{{ icPush }}Push<span class=\"gbm-mono\" style=\"font-size:9px\">2<\u002Fspan><\u002Fspan>\n        <span style=\"flex:1\"><\u002Fspan>\n        <span class=\"cal\">6<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-secondary)\">{{ icLoader }}Fetching origin — 199,960 / 199,960 objects<\u002Fspan>\n        <button class=\"gbm-btn gbm-btn-ghost gbm-btn-sm\">Cancel<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;height:26px;padding:0 10px;border-top:1px solid var(--border-subtle);background:var(--surface-panel-raised);font-size:10.5px;color:var(--text-secondary)\">\n        <span class=\"cal\">7<\u002Fspan><span style=\"display:inline-flex\">{{ icOk }}<\u002Fspan><span>Fast-forward 4 commits · 12 個檔案 · 412 ms<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start\">\n      <sc-for list=\"{{ dlgsPull }}\" as=\"d\" hint-placeholder-count=\"3\">\n        <div class=\"mock\" style=\"box-shadow:var(--shadow-lg)\">\n          <div class=\"mkbar\" style=\"height:32px\">\n            <span style=\"font-size:11.5px;font-weight:600;color:var(--text-primary);flex:1\">{{ d.name }}<\u002Fspan>\n            <span class=\"kbd\" style=\"display:{{ d.keyDisp }}\">{{ d.key }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:13px 14px;display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ d.fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                <div style=\"display:{{ f.labelDisp }};font-size:10px;letter-spacing:.04em;color:var(--text-tertiary)\">{{ f.label }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-start;gap:8px\">\n                  <span style=\"{{ f.markStyle }}\"><\u002Fspan>\n                  <span style=\"{{ f.boxStyle }}\">{{ f.v }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:{{ f.hintDisp }};font-size:10px;color:var(--text-tertiary);line-height:1.6\">{{ f.hint }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;gap:7px;justify-content:flex-end;border-top:1px solid var(--border-subtle);padding-top:11px\">\n              <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\">Cancel<\u002Fbutton>\n              <button class=\"{{ d.btnCls }}\">{{ d.primary }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:9px\">六種失敗 — 各自接到哪裡<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:.9fr .38fr .78fr 1.5fr\" class=\"tbl\">\n        <div class=\"th\">狀況<\u002Fdiv><div class=\"th\">發生在<\u002Fdiv><div class=\"th\">呈現<\u002Fdiv><div class=\"th\">下一步<\u002Fdiv>\n        <sc-for list=\"{{ pullErr }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div class=\"td\" style=\"color:var(--text-primary)\">{{ p.e }}<\u002Fdiv>\n          <div class=\"td gbm-mono\" style=\"font-size:10.5px\">{{ p.when }}<\u002Fdiv>\n          <div class=\"td\">{{ p.ui }}<\u002Fdiv>\n          <div class=\"td\">{{ p.act }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gbm-panel\" style=\"padding:14px 16px\">\n      <div style=\"font-size:12.5px;font-weight:600;margin-bottom:7px\">規則<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--text-secondary);line-height:1.9\">\n        <span class=\"cal\" style=\"vertical-align:middle\">5<\u002Fspan> Pull 按鈕上的數字是落後的 commit 數；為 0 時按鈕不 disabled（還是可以 fetch 確認），但 tooltip 寫「已是最新」。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">6<\u002Fspan> 進行中不開 modal、不鎖畫面：工具列右側就地顯示進度與 Cancel，其餘 UI 照常可讀。第 1 段的 Cancel 是安全的；進到第 3 段後按鈕改為 Abort 並要求確認。<br>\n        <span class=\"cal\" style=\"vertical-align:middle\">7<\u002Fspan> 結果一律一行寫在狀態列，含實際套用方式、數量、耗時。「已是最新」也要出現，不然使用者不知道按了有沒有反應。<br>\n        預設套用方式在 Preferences → Repositories 設一次（預設 rebase），每個 repo 可覆寫；<span class=\"kbd\">Ctrl/Cmd+Shift+P<\u002Fspan> 一律用預設值直接跑。<br>\n        pull 期間該 repo 的 Push / Checkout / Merge 全部 disabled，其他分頁與其他 repository 不受影響（P10 的並行規則）。<br>\n        每一段的 git 指令原文都進 log；失敗時的錯誤視窗永遠附得出「實際跑了什麼」。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;gap:9px;padding-top:6px\">\n    <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\" sc-camel-on-click=\"{{ prevPage }}\">← 上一頁<\u002Fbutton>\n    <button class=\"gbm-btn gbm-btn-secondary gbm-btn-sm\" sc-camel-on-click=\"{{ nextPage }}\">下一頁 →<\u002Fbutton>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900}}\">\nconst PAGES = [\n  { id: 'p1', num: '01', label: '平台與視窗架構' , title: '平台與視窗架構', intent: '三平台統一樣式，只有 menu bar 位置與標題列跟隨系統' },\n  { id: 'p2', num: '02', label: '主視窗 — History', title: '主視窗 — History', intent: 'commit description 的主要閱讀位置' },\n  { id: 'p3', num: '03', label: '主視窗 — Working Copy', title: '主視窗 — Working Copy', intent: '暫存、逐行 stage、撰寫 commit description' },\n  { id: 'p4', num: '04', label: 'Menu bar 與快捷鍵', title: 'Menu bar 與快捷鍵全表', intent: '每個動作的選單路徑與 shortcut' },\n  { id: 'p5', num: '05', label: 'Context menu 各層級', title: 'Context menu — 9 種目標、兩層', intent: '右鍵選單的層級與內容' },\n  { id: 'p6', num: '06', label: 'Dialogs', title: 'Dialogs', intent: 'Repository settings 由中央面板改為 dialog' },\n  { id: 'p7', num: '07', label: 'Clean 與 Conflict', title: 'Clean 與 Conflict 狀態', intent: '兩種狀態下 UI 與可用操作的差異' },\n  { id: 'p8', num: '08', label: 'Conflict 解決視窗', title: 'Conflict 解決視窗（獨立 window）', intent: '檔案清單 + 左 / 結果 / 右 三欄，拖曳與點行套用' },\n  { id: 'p9', num: '09', label: '分割線與縮放', title: '分割線與面板縮放', intent: '每條 splitter 的預設、下限與記憶行為' },\n  { id: 'p10', num: '10', label: 'Log 與背景狀態', title: 'Log 與背景狀態', intent: '長時間作業的進度、取消、錯誤與可稽核的指令紀錄' },\n  { id: 'p11', num: '11', label: 'Preferences', title: 'Preferences', intent: 'repository 來源資料夾、自動掃描與手動開啟紀錄' },\n  { id: 'p12', num: '12', label: '看變更與比較', title: '看變更與比較', intent: 'commit / stash 的變更檢視，以及四種 ref 的 compare' },\n  { id: 'p13', num: '13', label: 'Rename 與多選', title: 'Branch re  note: 'History 標題列右側一顆按鈕開出勾選清單：Graph、Message、Refs、Author、Date、Commit hash、Committer、Changed files。Graph 與 Message 固定不可關，其餘可開關並拖曳排序。設定存在應用層級，所有 repo 共用；欄寬各自可拖曳並記憶。Date 欄採混合格式：24 小時內用相對時間（2h、6h），超過一天一律改絕對日期（Aug 13），跨年再補年份。相對時間只在一眼能算得出來的範圍內有意義，超過就該給確切日期。滑鼠停留顯示完整 ISO 8601 時間含時區。作者為本人的 commit，Author 欄以 accent 色加粗顯示，比對依據是 user.email。' },\n  { n: 15, el: 'Repository 切換彈窗', menu: 'File → Switch repository…', key: 'Ctrl/Cmd+R', note: 'Sidebar 最上方一顆顯示目前 repo 的按鈕，點擊或按快捷鍵開彈窗。彈窗內是可搜尋的 repo 清單，每列顯示名稱與 ahead/behind，最近開啟的排前面；底部固定 Open / Clone 兩個入口。選定後彈窗關閉、整個視窗切到該 repo。Esc 關閉不切換。之所以獨立出來，是因為切 repo 是低頻但影響全視窗的動作，和高頻的分支操作混在同一份清單會互相干擾。' },\n  { n: 14, el: 'Branch filter', menu: 'Edit → Filter branches', key: 'Ctrl/Cmd+Shift+E', note: '一個輸入框同時過濾 Branches、Tags、Stash 三段：子字串比對、不分大小寫、斜線視為分隔（打 gl 可命中 feature/graph-lanes）。有輸入時資料夾全展開，清空後回到原本收合狀態。沒有命中的段落整段隱藏，不留空標題。右側顯示 命中/總數。目前分支永遠置頂顯示，即使不符合條件也不會被濾掉。Esc 清空並回到未過濾狀態，↓ 直接跳進第一個結果。' },\n  { n: 13, el: 'History / Working Copy 分頁列', menu: 'View → History / Working copy', key: 'Ctrl/Cmd+1 / +2', note: '中央區最上方。常駐兩個分頁（Repository settings 已移為 dialog），Compare 以額外分頁的形式加在右側、可關閉。' + 'Working Copy 分頁右側常駐顯示未提交檔案數的 badge，數字為 0 時不顯示。切換分頁不影響 sidebar 選取與各面板寬度。Ctrl/Cmd+Tab 在兩個分頁間來回。' },\n];\n\nconst P3 = [\n  { n: 1, el: 'Unstaged 清單', menu: 'View → Working copy', key: 'Ctrl/Cmd+2', note: '勾選＝stage 整檔；拖曳到右欄同效。右鍵見 05-F。' },\n  { n: 2, el: 'Splitter D', menu: '—', key: '雙擊還原', note: 'unstaged / staged 垂直分界，預設 1:1。' },\n  { n: 3, el: 'Staged 清單', menu: 'Repository → Stage all', key: 'Ctrl/Cmd+Shift+S', note: '取消勾選＝unstage。拖回左欄同效。' },\n  { n: 4, el: 'Splitter E', menu: '—', key: '雙擊還原', note: '檔案區與 diff 區的水平分界。' },\n  { n: 5, el: 'Diff — 逐行 stage', menu: 'Repository → Stage selected lines', key: 'Ctrl/Cmd+Shift+Enter', note: '每個變更行左側一個 checkbox；右鍵可 Stage line / Stage hunk / Unstage hunk / Copy line。' },\n  { n: 6, el: 'Summary 欄', menu: '—', key: 'Ctrl/Cmd+Enter 送出', note: 'commit 的 subject 行，50 字後變色提示，不硬性阻擋。' },\n  { n: 7, el: 'Description 欄', menu: '—', key: 'Tab 由 sum
